<!doctype html><html><head><meta charset="utf-8"><title>Sprites backdrops: QA render</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c"></canvas>
<script src="bd.js"></script>
<script>
/* QA: preview.html?n=12&w=3456&h=2234&t=0&boost=0&nc=0  (window.__ready set when drawn; window.__err on failure)
 * window.__draw(n, t, opts) redraws; window.__px() returns the RGBA bytes of the canvas as base64 for measurement. */
const q = new URLSearchParams(location.search), c = document.getElementById("c");
c.width = +(q.get("w") || 1728); c.height = +(q.get("h") || 1117);
window.__draw = (n, t, o) => SpritesBackdrops.draw(c, n, t, o || {});
SpritesBackdrops.load("").then(() => { __draw(+(q.get("n") || 1), +(q.get("t") || 0), { boost: q.get("boost") === "1", nc: q.get("nc") === "1" }); window.__ready = true; })
  .catch(e => { window.__err = String(e && e.message || e); });
</script></body></html>
