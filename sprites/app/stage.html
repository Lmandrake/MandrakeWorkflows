    // Link (owner, 2026-11-01 ~08:15: "we need to check VPN, on-site network, AND we need to monitor for API cannot be reached...
    // they are interrelated and each informative"). Truth table (SHIP_PLAN "VPN, on-site network and API"):
    //   lost = api failing with error_kind network (agents cannot reach the API), whatever the VPN says;
    //          ALSO VPN down and not on the on-site network (on_site false or unknown), whatever the API says: owner ruling
    //          2026-11-03 ("panic on VPN down"; no agent was busy at a hibernation wake, so there was no API evidence)
    //   risk = no longer produced here (the debounce, runtime and layers still carry it)
    //   ok   = on the on-site network or VPN up, API not failing on the network; also: api failing for another reason (rate limit,
