  const ps = G.parts; let j = 0;
  for (let i = 0; i < ps.length; i++) { const p = ps[i]; p.life -= dt; if (p.life <= 0) continue;
    if (p.k === 2) { p.vx *= 1 - 1.4 * dt; p.vy *= 1 - 1.4 * dt; } else if (p.k === 0) { p.vy -= 10 * dt; }
    p.x += p.vx * dt; p.y += p.vy * dt; if (p.y < V.TOP + 2) continue; ps[j++] = p; }
  ps.length = j;
}

function drawCraft(V, ctx, c, t) {
  const P = V.P, sz = P.size * G.sc, gl = P.glow, heat = G.heat, vpn = G.vpnA, F = FORMS[c.iv];
  const rx = rad(c, P), ry = rx * 0.3, coreR = rx * 0.36;
  const nt = t - c.needT0, breath = c.need > 0.01 ? 0.5 - 0.5 * Math.cos(TAU * nt / 1.6) : 0;
  const x = c.x + c.jx, y = c.y + c.jy - c.need * 4 * Math.sin(TAU * nt / 1.6) * sz;
  const B = (0.42 + 0.5 * c.work + 0.25 * c.need) * (1 + 0.45 * heat) * (1 - 0.16 * (1 - c.work) * (0.5 + 0.5 * Math.sin(TAU * t / 6.5 + c.sx)));
  const ct = Math.cos(c.tilt), st = Math.sin(c.tilt);
  const N = Math.max(10, Math.round(26 * P.density));
  const LR = 15 * sz * Math.sqrt(gl);
  const owns = 1 - vpn * 0.55;
  const se = F.se, ce = Math.sqrt(1 - se * se), cb = Math.cos(F.bank), sb = Math.sin(F.bank);
  const hs = 95 - 55 * vpn;
  // project a craft-local 3D point (rx units; Y up, Z to viewer) to screen; returns depth too
  let PX = 0, PY = 0, PD = 0, OX = 0, OY = 0, OT = 0;
  const proj = (X, Y, Z) => { const X1 = X * cb - Y * sb, Y1 = X * sb + Y * cb;
    const sx = X1 * rx, sy = (-Y1 * ce + Z * se) * rx; PD = Z * ce + Y1 * se;
    const c2 = Math.cos(c.tilt + OT), s2 = Math.sin(c.tilt + OT);

  const dz = Math.pow(V.on("strainAgitation") ? heat : 0, 1.3);
  const misalign = (ri) => { if (dz < 0.01) { OX = OY = OT = 0; return; }
    const q = ri * 17.3 + c.sx;
    OX = dz * 0.16 * rx * 2 * (V.vnoise(q, t * 1.7) - 0.5); OY = dz * 0.1 * rx * 2 * (V.vnoise(q + 5, t * 1.7) - 0.5);
    OT = dz * 0.22 * 2 * (V.vnoise(q + 9, t * 1.3) - 0.5); };

  // needs-you: beam and ripples, behind the craft
  if (c.need > 0.02) {
    const a = c.need * (0.07 + 0.1 * breath) * gl, L = 110 * sz;
    const g = ctx.createLinearGradient(0, y + ry, 0, y + ry + L);
    g.addColorStop(0, V.hsl(c.hue, 90, 65, a)); g.addColorStop(1, V.hsl(c.hue, 90, 60, 0));
    ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.beginPath();
    ctx.moveTo(x - coreR * 0.6, y + ry * 0.6); ctx.lineTo(x + coreR * 0.6, y + ry * 0.6);
    ctx.lineTo(x + rx * 0.95, y + ry + L); ctx.lineTo(x - rx * 0.95, y + ry + L); ctx.closePath(); ctx.fill();
    const a1 = ((nt % 1.6) + 1.6) % 1.6;
    for (const age of [a1, a1 + 1.6]) { if (age > 2.6 || age > nt + 0.001) continue;
      const k = age / 2.6, R = rx * (1.05 + 1.3 * k);
      ctx.globalAlpha = c.need * 0.55 * (1 - k) * (1 - k); ctx.strokeStyle = V.hsl(c.hue, 85, 72, 1); ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.ellipse(x, y, R, R * 0.34, c.tilt, 0, TAU); ctx.stroke(); }
    glow(ctx, c.hue, 90, 60, x, y, rx * 2.0 * Math.sqrt(gl), c.need * (0.10 + 0.14 * breath) * gl);
  }
  // soft body halo (declared decoration, scaled by glow)
  glow(ctx, c.hue, 70 * owns, 55, x, y, rx * 1.3 * Math.sqrt(gl), 0.09 * B * gl);
  if (heat > 0.03) { glow(ctx, 14 - 12 * heat, 100, 46, x, y, rx * (1.5 + 0.7 * heat) * Math.sqrt(gl), 0.5 * Math.pow(heat, 1.2) * gl);
    glow(ctx, 6, 100, 50, x, y + ry * 0.3, rx * 0.95 * Math.sqrt(gl), 0.45 * heat * gl); }

  const hotHue = 34 - 34 * clamp((heat - 0.55) / 0.4, 0, 1);
  // one LED: shared colour grammar (own hue / heat / VPN grey / play rainbow); i = slot index for texture
  const led = (px, py, i, nI, lit, chase, depth, Rk) => {
    let a = lit ? (0.45 + 0.55 * chase) * B : 0.16 * B;
    if (lit && G.mp > 0.02 && V.vnoise(i * 3.1 + c.sx, t * 2.2) > 0.66) a *= 1 - 0.8 * G.mp;
    if (heat > 0.05) a *= 1 - heat * 0.4 * V.vnoise(i * 7.3 + c.sy, t * 3);
    if (lit) a = Math.max(a, c.need * (0.55 + 0.45 * breath));
    a *= depth;
    const hh = c.hue + ((i % 3) - 1) * 12;
    const wH = Math.min(0.95, heat * (i % 2 ? 1.05 : 0.8)) * (1 - vpn), wC = vpn * 0.8 * (i % 2 ? 1 : 0.7), wP = 0;
    if (dz > 0.01) { px += dz * 0.07 * rx * 2 * (V.vnoise(i * 2.3 + c.sy, t * 2.4) - 0.5); py += dz * 0.05 * rx * 2 * (V.vnoise(i * 2.3 + c.sx, t * 2.4 + 3) - 0.5); }
    const wO = Math.max(0, 1 - wH - wC - wP);
    const R = LR * Rk * (lit ? 1 : 0.5) * (0.8 + 0.5 * chase);
    glow(ctx, hh, 92, 60, px, py, R, a * wO * gl);
    if (wH > 0.01) glow(ctx, hotHue, 100, 58 + 10 * heat, px, py, R * (1 + 0.3 * heat), a * wH * gl);
    if (wC > 0.01) glow(ctx, 212, 14, 68, px, py, R, a * wC * gl * 0.8);
    if (wP > 0.01) glow(ctx, c.hue + 360 * i / nI + t * 70, 95, 62, px, py, R, a * wP * gl);
    const dom = wO >= 0.5 ? [hh, 85, 82] : (wH >= wC && wH >= wP ? [hotHue, 100, 78 + 12 * heat] : (wC >= wP ? [212, 12, 80] : [c.hue + 360 * i / nI + t * 70, 90, 80]));
    ctx.globalAlpha = Math.min(1, a * 1.1 + (lit ? 0.08 : 0.02));
    diamond(ctx, px, py, (lit ? 1.9 + 1.6 * chase : 1.0) * sz * (0.75 + 0.25 * Rk), V.hsl(dom[0], dom[1], dom[2], 1));
  };
  // chase value for angle th on ring r (speed = CPU via c.phi; heads/direction/step = the form's rhythm)
  const chaseAt = (r, th) => { let ph = c.phi * r.dir + (r.phase || 0);
    if (r.step) { const q = TAU / r.C; ph = Math.floor(ph / q) * q + q * 0.5; }
    let best = 0;
    for (let h = 0; h < r.heads; h++) { const hp = ph + TAU * h / r.heads;
      const dd = r.dir > 0 ? ((hp - th) % TAU + TAU) % TAU : ((th - hp) % TAU + TAU) % TAU;
      const v = Math.exp(-dd * r.decay); if (v > best) best = v; }
    return best; };
  // glass hairlines: the form's skeleton stays legible whatever memory lights (back half fainter)
  const hairA = (0.16 + 0.12 * c.work) * gl * (1 - 0.4 * vpn), hairCol = V.hsl(heat > 0.3 ? hotHue : c.hue, 55 * owns, 78, 1);
  const hair = (front) => { ctx.strokeStyle = hairCol; ctx.lineWidth = 1; ctx.globalAlpha = Math.min(1, hairA * (front ? 1 : 0.5));
    for (let ri = 0; ri < F.rings.length; ri++) { const r = F.rings[ri]; misalign(ri); if (r.clus) continue; const cy = r.yaw != null ? Math.cos(r.yaw) : 0, sy = r.yaw != null ? Math.sin(r.yaw) : 0;
      ctx.beginPath(); let on = false;
      for (let q = 0; q <= 40; q++) { const th = TAU * q / 40, co = Math.cos(th), sn = Math.sin(th);
        if (r.yaw == null) proj(co * r.R, r.h, sn * r.R); else proj(co * r.R * cy, r.h + sn * r.R, co * r.R * sy);
        if ((PD > 0) === front) { if (on) ctx.lineTo(PX, PY); else ctx.moveTo(PX, PY); on = true; } else on = false; }
      ctx.stroke(); }
    if (F.spokes) for (let k2 = 0; k2 < F.spokes; k2++) { const th = TAU * k2 / F.spokes + 0.2, co = Math.cos(th), sn = Math.sin(th);
      misalign(0); proj(co * 0.38, 0, sn * 0.38); if ((PD > 0) !== front) continue; ctx.beginPath(); ctx.moveTo(PX, PY); proj(co, 0, sn); ctx.lineTo(PX, PY); ctx.stroke(); } };
  const rings = (front) => {
    hair(front);
    for (let ri = 0; ri < F.rings.length; ri++) { const r = F.rings[ri], sl = slots(F, ri, N), n = sl.length; misalign(ri);
      const litN = Math.max(2, Math.round(n * c.memF)), Rk = 0.7 + 0.3 * r.R, cy = r.yaw != null ? Math.cos(r.yaw) : 0, sy = r.yaw != null ? Math.sin(r.yaw) : 0;
      for (let i = 0; i < n; i++) { const th = sl[i], co = Math.cos(th), sn = Math.sin(th);
        if (r.yaw == null) proj(co * r.R, r.h, sn * r.R); else proj(co * r.R * cy, r.h + sn * r.R, co * r.R * sy);
        if ((PD > 0) !== front) continue;
        const lit = Math.floor((i + 1) * litN / n) > Math.floor(i * litN / n);
        led(PX, PY, i + ri * 7, n, lit, chaseAt(r, th), front ? 1 : 0.55, Rk); } }
    if (F.spokes) { const r0 = F.rings[0]; misalign(0);
      for (let s = 0; s < F.spokes; s++) { const th = TAU * s / F.spokes + 0.2, ch = chaseAt(r0, th), co = Math.cos(th), sn = Math.sin(th);
        for (const u of [0.5, 0.66, 0.82]) { proj(co * u, 0, sn * u); if ((PD > 0) !== front) continue;
          led(PX, PY, s * 3 + Math.round(u * 10), 15, true, ch * (0.4 + 0.6 * u), (front ? 1 : 0.6) * 0.8, 0.62); } } }
  };
  // network lanes: 8 radial paths in the main deck; in = rim->core (cool), out = core->rim (gold); jam bunches at the rim
  const NL = 8, h0 = F.rings[0].h || 0, u0 = 0.4, u1 = 0.97, K = 3, bs = c.bs, act = Math.max(c.rxL, c.txL);
  const lanes = (front) => { if (act < 0.01) return; misalign(0);
    const pw = 1 + 3 * bs;
    for (let l = 0; l < NL; l++) { const th = TAU * l / NL + 0.39, co = Math.cos(th), sn = Math.sin(th);
      if ((sn > 0) !== front) continue; const dep = front ? 1 : 0.6;
      proj(co * u0, h0, sn * u0); const ax = PX, ay = PY; proj(co * u1, h0, sn * u1);
      ctx.globalAlpha = Math.min(1, 0.22 * act * gl * dep); ctx.strokeStyle = "rgba(215,225,240,1)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(PX, PY); ctx.stroke();
      for (const dir of [-1, 1]) { const L = dir < 0 ? c.rxL : c.txL; if (L < 0.01) continue;
        const ph = dir < 0 ? c.rxPh : c.txPh, hu = dir < 0 ? 200 : 42, sa = dir < 0 ? 70 : 95, li = dir < 0 ? 82 : 64;
        for (let j = 0; j < K; j++) { const w = clamp(L * K * 1.1 - j, 0, 1); if (w <= 0) continue;
          const s0 = ((ph + l * 0.618 + j / K) % 1 + 1) % 1;
          // s: 0 = where the pulse enters, 1 = where it leaves; jam compresses inbound pulses at the rim, outbound at the rim too
          const s = dir < 0 ? Math.pow(s0, pw) : Math.pow(s0, 1 / pw);
          const u = dir < 0 ? u1 - (u1 - u0) * s : u0 + (u1 - u0) * s;
          const env = Math.min(1, s0 * 7) * Math.min(1, (1 - s0) * (bs > 0.3 ? 30 : 7));
          const a = w * env * dep * (0.75 + 0.25 * L);
          for (let tr = 2; tr >= 0; tr--) { const ut = u - dir * tr * 0.045 * (1 - 0.6 * bs); proj(co * ut, h0, sn * ut);
            const kt = tr ? 0.45 / tr : 1;
            glow(ctx, hu, sa, li, PX, PY, (tr ? 4.5 : 7.5) * sz * Math.sqrt(gl), a * kt * gl);
            if (!tr) { ctx.globalAlpha = Math.min(1, a); diamond(ctx, PX, PY, 2.1 * sz, V.hsl(hu, sa * 0.6, 90, 1)); } } } }
      if (bs > 0.03) { const fl = 0.75 + 0.25 * V.vnoise(l * 3.7 + c.sx, t * 2.6);
        for (const uu of [0.9, 0.95]) { proj(co * uu, h0, sn * uu);
          glow(ctx, c.rxL >= c.txL ? 205 : 45, 50, 88, PX, PY, 9 * sz * Math.sqrt(gl), 0.7 * bs * act * fl * dep * gl); } } } };
  rings(false); lanes(false);
  // glass core
  ctx.globalAlpha = 0.3 + 0.15 * c.work; ctx.strokeStyle = V.hsl(c.hue, 25 * owns, 85, 1); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, coreR, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 0.28; ctx.strokeStyle = "rgba(235,240,255,1)"; ctx.beginPath(); ctx.arc(x, y, coreR * 0.78, -2.5, -1.6); ctx.stroke();
  glow(ctx, c.hue, hs, 62, x, y, coreR * 1.5 * Math.sqrt(gl), (0.3 + 0.25 * c.work + 0.35 * c.need) * gl);
  if (c.rxL > 0.02) glow(ctx, 200, 70, 80, x, y, coreR * 1.3 * Math.sqrt(gl), 0.4 * c.rxL * gl);
  if (c.txL > 0.02) glow(ctx, 42, 95, 62, x, y, coreR * 1.1 * Math.sqrt(gl), 0.3 * c.txL * gl);
  ctx.globalAlpha = 1; diamond(ctx, x, y, 2.6 * sz, V.hsl(c.hue, hs, 74, 1));
  // beacon spire (identity + emitter): the form's own mast / antennae / crown / pendant
  for (const [dx, dy, cs, s, rf] of F.spire) {
    const X = dx * sz, Y = dy * sz + cs * coreR + rf * rx;
    const qx = x + X * ct - Y * st, qy = y + X * st + Y * ct;
    glow(ctx, c.hue, hs, 64, qx, qy, 5 * sz * Math.sqrt(gl), 0.5 * B * gl);
    ctx.globalAlpha = 0.85; diamond(ctx, qx, qy, s * sz, V.hsl(c.hue, hs * 0.8, 82, 1)); }

  // satellites = processes
  const np = Math.max(1, Math.round(c.procs)), sr = rx * 1.5, sry = rx * 0.55, stl = -0.38 + c.tilt;
  for (let j = 0; j < np; j++) {
    const a = c.sphi + TAU * j / np, ex = Math.cos(a) * sr, ey = Math.sin(a) * sry;
    const qx = x + ex * Math.cos(stl) - ey * Math.sin(stl), qy = y + ex * Math.sin(stl) + ey * Math.cos(stl);

    glow(ctx, c.hue + 20, 55 * owns, 72, qx, qy, 4.5 * sz * Math.sqrt(gl), 0.45 * B * dep * gl);
    ctx.globalAlpha = 0.8 * dep; diamond(ctx, qx, qy, 1.3 * sz, V.hsl(c.hue + 20, 40 * owns, 86, 1));

}

function draw(V, S, ctx) {
  const P = V.P, t = G.t, gl = P.glow, k = G.k, sz = P.size * G.sc;
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  // VPN lost: searching beam + a small blinking red beacon over the huddle
  if (!V.LIVE && G.vpnA > 0.02 && V.on("vpnHuddle")) {
    const [hx, hy] = G.hud, ang = -Math.PI / 2 + 0.75 * Math.sin(t * 0.8), L = 460 * Math.max(0.6, k), wdt = 0.09;
    const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, L);
    g.addColorStop(0, `rgba(170,195,230,${0.16 * G.vpnA * gl})`); g.addColorStop(1, "rgba(170,195,230,0)");
    ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(hx, hy);
    ctx.arc(hx, hy, L, ang - wdt, ang + wdt); ctx.closePath(); ctx.fill();
    const ph = (t % 1.5) / 1.5, pulse = Math.exp(-Math.pow(ph / 0.09, 2)) + 0.25;
    glow(ctx, 0, 100, 55, hx, hy - 70 * sz, 16 * sz * Math.sqrt(gl), G.vpnA * pulse * gl);
    ctx.globalAlpha = G.vpnA * Math.min(1, pulse + 0.2); diamond(ctx, hx, hy - 70 * sz, 2.6 * sz, "hsl(0,100%,70%)");
  }
  // reconnect bloom ring
  const bt = t - G.bloomT;
  if (bt >= 0 && bt < 2.2 && V.on("vpnHuddle")) { const q = bt / 2.2, [hx, hy] = G.hud, kb = Math.max(0.6, k);
    G.c.forEach((c, i) => { ctx.globalAlpha = 0.5 * (1 - q) * (1 - q); ctx.strokeStyle = V.hsl(c.hue, 95, 68, 1); ctx.lineWidth = 2;
      const R = (40 + 300 * q + i * 10) * kb; ctx.beginPath(); ctx.ellipse(hx, hy, R, R * 0.5, 0, 0, TAU); ctx.stroke(); }); }
  for (const c of G.c) V.creature(c.id, () => drawCraft(V, ctx, c, t));
  // particles
  for (const p of G.parts) { const f = p.life / p.L;
    if (p.k === 1) { ctx.globalAlpha = 0.5 * Math.min(1, f * 2); ctx.fillStyle = V.hsl(p.h, p.s, p.l, 1); ctx.fillRect(p.x - 0.8, p.y - 0.8, 1.6 * sz, 1.6 * sz); }
    else { glow(ctx, p.h, p.s, p.l, p.x, p.y, (p.k === 2 ? 6 : 4) * sz * Math.sqrt(gl), Math.min(1, f * 1.5) * (p.k === 2 ? 0.8 : 0.7) * gl);
      ctx.globalAlpha = Math.min(1, f * 1.5); diamond(ctx, p.x, p.y, 1.1 * sz, V.hsl(p.h, p.s, 82, 1)); } }
  ctx.restore();
}

function place(V, id, x, y) { const c = G.c.find(q => q.id === id); if (c) { c.x = x; c.y = y; c.vx = c.vy = 0; } }
V.piece({ init, step, draw, carry, lightSpots, place });
})();
