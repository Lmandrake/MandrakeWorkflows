<!doctype html>
<html><head><meta charset="utf-8"><title>C2 Siphonophores: hovering light-craft</title></head><body>
<script id="COLOPHON" type="application/json">[
"One hovering light-craft per session, colour = session. Bell size (area) = memory; CPU = tempo of the running lights chasing round the rim (and the bell's breathing); bright = working, dim = idle",
"Beam-tentacles = background tasks (one each, a blinking beacon at every tip, count them)",
"Download = cool white-blue pulses climbing the tentacles INTO the core; upload = gold pulses running OUT from the core to the tips; more and brighter = more Mbit/s. Link too slow: pulses stall, stutter and pile into a bright clog at the bell's throat",
"Swims to the window's edge, taps and sends slow dotted rings = needs you",
"Machine strain (level, heat, memory pressure): a red ember glow behind and inside the craft, and its lattice slips out of alignment as if noise were added; tentacles writhe; memory pressure shortens them",
"VPN down: cold grey, lights stop, tentacles hang limp, huddle, a small red beacon blinks, no traffic, a slow searching beam; one bloom = back. Two idle craft drifting together for one twirl, then parting = play (means nothing). Halo, beam cone and tint ripple are decoration",
"Form (bell silhouette, dot pattern, tentacle arrangement, oral arms) = which variant, never data"
]</script>
<script src="timelines.js"></script>
<script src="scenarios.js"></script>
<script src="size_norm.js"></script>
<script src="visitors_runtime.js"></script>
<script>
V.piece((function () {
  "use strict";
  const TAU = Math.PI * 2, W = V.W, H = V.H, P = V.P, TOP = V.TOP, BOT = V.BOT;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const ease = (dt, tau) => 1 - Math.exp(-dt / tau);
  const sm = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const hash1 = n => { let h = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  // LEGACY = the blind-trial stage (1280x800 with menu bar and dock): layout exactly as trialled.
  const LEGACY = TOP > 0 && W === 1280 && H === 800;
  // Live mode: V.sessions and P.size change at runtime, so these are recomputed in init (and TLEN in resize).
  // For a fixed session count and size 1 the numbers are exactly the load-time ones they used to be.
  let NS, SC, KMEM, TLEN, NB;
  const NTMAX = 12;                                  // max tentacles (procs 1..12)
  // ---- fine-pixel experiment hook (docs/SYMBOL_RESOLUTION.md, round 2) ----------------------------------
  // Read from ONE optional global that only tools/build_symbol_comparison.py sets (via a playwright init
  // script); app/stage.html never sets it, so with nothing set every default below is the shipped value and
  // the jellyfish render exactly as before. Knobs: rings / dots = multipliers on bell rings and dots per
  // ring; beads = multiplier on beads per tentacle; size = multiplier on every hard dot; glow = multiplier on
  // the per-dot soft glows; halo = multiplier on the body halo and the core flashes (0 = none); pulseGlow = alpha of
  // an extra faint wide glow under each bandwidth pulse only (0 = none, shipped), pulseGlowR = its radius in pulse
  // dot diameters (default 2.5). Additive, so body dots are untouched wherever no pulse is near.
  const JT = (typeof window.SPRITES_JELLY_TUNE === "object" && window.SPRITES_JELLY_TUNE) || {};
  const J_RING = JT.rings > 0 ? JT.rings : 1, J_DOTS = JT.dots > 0 ? JT.dots : 1, J_BEADS = JT.beads > 0 ? JT.beads : 1;
  const J_SIZE = JT.size > 0 ? JT.size : 1, J_GLOW = JT.glow >= 0 ? JT.glow : 1, J_HALO = JT.halo >= 0 ? JT.halo : 1;
  const J_PGLOW = JT.pulseGlow > 0 ? JT.pulseGlow : 0, J_PGLOWR = JT.pulseGlowR > 0 ? JT.pulseGlowR : 2.5;
  // sizeParity (0.53, 2026-11-07, bbox-area parity with Choir) is RETIRED: drawn size is now equalised for every species
  // and context by one table (prototype/size_norm.js, measured by tools/size_calibrate.py). Kept at 1 as a seam only.
  const sizeParity = 1, lowMemBoost = (m) => 1 + 0.075 * clamp((0.8 - m) / 0.4, 0, 1), PSZ = () => P.size * sizeParity;
  const FIT = new URLSearchParams(location.search).get("fit") === "1";
  function scales() {
    NS = V.sessions.length;
    // creature scale: 1 on the trial stage; in gallery cells it follows stage height and session count
    SC = LEGACY ? 1 : (H - TOP - BOT) / 400 * (NS <= 1 ? 0.95 : NS <= 3 ? 0.9 : NS <= 6 ? 0.85 : 0.8);
    // LIVE ONLY: the screen is a full desktop (e.g. 1728x1117), where (H-TOP-BOT)/400 gives giant craft (SC ~2.1).
    // Cap SC at the blind-trial scale, min(W/1280, H/800): the trial look (1280x800) scaled to this screen.
    // (Non-LEGACY at SC=1 has bell 1.45x and tentacles 0.78x the trial's; whole-craft height is about the same.)
    if (V.LIVE) SC = Math.min(SC, Math.min(W / 1280, H / 800));
    // fit=1 (Settings tiles only): size the craft to the cell, as Choir's grid fit does, instead of H/400, which
    // left a ~15 px bell in a 110 px tile. Craft height per unit SC is about 160 * PSZ() (bell 2*KMEM*sqrt(0.8) + TLEN).
    if (FIT) SC = 0.65 * (H - TOP - BOT) / (160 * PSZ());
    KMEM = 26 * SC * (LEGACY ? 1 : 1.45);                               // bell radius px = KMEM*sqrt(GB): area true to memory
    NB = Math.max(6, Math.round(16 * P.density * J_BEADS)); // beads per tentacle
    TLEN = 118 * PSZ() * SC * (LEGACY ? 1 : 0.78);                     // tentacle length (fixed: memory reads on the bell only)
  }
  scales();
  const rad = m => KMEM * Math.sqrt(clamp(m, 0.15, 3)) * PSZ() * lowMemBoost(m);   // lowMemBoost: parity needs ~7% more bell at 0.4 GB

  // ---------- individualizer: 8 forms (silhouette, dot pattern, tentacle arrangement, oral arms) ----------
  // None touches a data channel: bell AREA stays memory, pulse RATE stays CPU, tentacle COUNT stays procs.
  const VARS = [
    { name: "Moon",    prof: "dome",    R: 7,  pat: "rings",     arr: "curtain", oral: "manubrium" },
    { name: "Lantern", prof: "lantern", R: 10, pat: "meridians", arr: "bundle",  oral: "wick" },
    { name: "Saucer",  prof: "saucer",  R: 6,  pat: "spiral",    arr: "ring",    oral: "tuft" },
    { name: "Box",     prof: "box",     R: 8,  pat: "wire",      arr: "corners", oral: "none" },
    { name: "Lyre",    prof: "bell",    R: 8,  pat: "bands",     arr: "sides",   oral: "curls" },
    { name: "Spire",   prof: "spire",   R: 9,  pat: "stars",     arr: "coil",    oral: "none" },
    { name: "Pagoda",  prof: "pagoda",  R: 10, pat: "tiers",     arr: "frill",   oral: "frills" },
    { name: "Corolla", prof: "flower",  R: 7,  pat: "spokes",    arr: "lobes",   oral: "cauli" },
  ];
  const VARIANT_NAMES = VARS.map(v => v.name); window.VARIANT_NAMES = VARIANT_NAMES;
  // profile(t, az): t 0 apex .. 1 rim -> [rho, y] in bell radii (y down, before perspective)
  function profile(kind, t, az) {
    switch (kind) {
      case "lantern": return [0.6 * Math.pow(Math.sin(Math.PI * (0.06 + 0.88 * t)), 0.8) + 0.12 * t ** 6, -0.98 + 1.48 * t];
      case "saucer": { const th = 0.15 + 1.45 * t; return [1.32 * Math.sin(th), -Math.cos(th) * 0.34 + 0.24]; }
      case "box": return t < 0.3 ? [0.92 * t / 0.3, -0.62 + 0.05 * t / 0.3] : [0.92 + 0.04 * (t - 0.3) / 0.7, -0.57 + 1.0 * (t - 0.3) / 0.7];
      case "bell": { if (t < 0.25) { const f = t / 0.25 * Math.PI / 2; return [0.5 * Math.sin(f), -0.8 + 0.26 * (1 - Math.cos(f))]; }
        const s = (t - 0.25) / 0.75; return [0.5 + 0.06 * s + 0.66 * s ** 3.2, -0.54 + 0.98 * s]; }
      case "spire": return [0.95 * Math.pow(Math.sin(t * Math.PI / 2), 1.5), -1.2 + 1.6 * t];
      case "pagoda": { if (t < 0.4) { const th = 0.15 + 1.35 * t / 0.4; return [0.52 * Math.sin(th), -1.0 + 0.4 * (1 - Math.cos(th))]; }
        const s = (t - 0.4) / 0.6; return [0.28 + 0.74 * Math.pow(Math.sin(s * Math.PI / 2), 0.8), -0.52 + 0.94 * s]; }
      case "flower": { const th = 0.12 + 1.6 * t, l = Math.cos(5 * az);
        return [Math.sin(th) * (1 + 0.3 * t ** 2.5 * l), -Math.cos(th) * 0.82 + 0.28 + 0.16 * t ** 3 * l]; }
      default: { const th = 0.12 + 1.6 * t; return [Math.sin(th), -Math.cos(th) * 0.82 + 0.28 + (t >= 1 ? 0.06 * Math.sin(az * 8) * 0.82 : 0)]; }
    }
  }
  // dot-pattern weight on the bell (0 = dot absent, >1 = brighter, larger)
  function pattern(v, k, l, az, t, X, Z) {
    const R = v.R, rim = k === R - 1;
    switch (v.pat) {
      case "meridians": return Math.cos(6 * az) > 0.8 ? 1.25 : (rim || k === 5) ? 1 : 0.1;
      case "spiral": return rim ? 1.1 : (((az / TAU * 3 - t * 1.5) % 1 + 1) % 1 < 0.34 ? 1.25 : 0.1);
      case "wire": return (rim || k === 2 || Math.abs(Math.sin(2 * az)) > 0.93) ? 1.3 : 0;
      case "bands": return rim || k === R - 2 ? 1.3 : (k % 2 === 0 ? 1 : 0);
      case "stars": return Math.sin(az) > 0.985 ? 1.2 : rim ? 0.9 : (hash1(k * 97 + l * 13 + 5) < 0.22 ? 1.7 : 0);
      case "tiers": return (k === 3 || rim) ? 1.45 : 0.75;
      case "spokes": return rim ? 1 : (Math.cos(5 * az) > 0.72 ? 1.3 : (k === 0 ? 0.6 : 0));
      default: return 1;
    }
  }
  // precomputed geometry per variant: bell dots, apex, rim, extents
  const GEO = VARS.map(v => {
    const dots = [], Rn = J_RING === 1 ? v.R : Math.round((v.R - 1) * J_RING) + 1;
    for (let kk = 0; kk < Rn; kk++) {
      const t = Rn === 1 ? 1 : kk / (Rn - 1);
      // fine rings map back onto the variant's own ring index for its dot pattern; the rim stays ONE ring
      const k = J_RING === 1 ? kk : kk === Rn - 1 ? v.R - 1 : Math.min(v.R - 2, Math.round(t * (v.R - 1)));
      const kf = J_RING === 1 ? k : t * (v.R - 1);
      const r0 = profile(v.prof, t, 0)[0], m = Math.max(3, Math.round((v.prof === "dome" ? 4 + kf * 5 : 4 + 30 * r0) * P.density * J_DOTS));
      for (let l = 0; l < m; l++) {
        const az = l / m * TAU + (v.pat === "spokes" || v.pat === "wire" || v.pat === "meridians" ? 0 : kf * 0.35);
        let [rho, y] = profile(v.prof, t, az), X = rho * Math.cos(az), Z = rho * Math.sin(az);
        if (v.prof === "box") { const c = Math.cos(az), s = Math.sin(az), e = 0.25;   // square cross-section
          X = rho * Math.sign(c) * Math.abs(c) ** e; Z = rho * Math.sign(s) * Math.abs(s) ** e * 0.9; }
        const w = pattern(v, k, l, az, t, X, Z); if (w <= 0) continue;
        dots.push({ k, az, X, Y: y, Z, f: Math.sin(az), w, rim: kk === Rn - 1 });
      }
    }
    const top = profile(v.prof, 0, 0)[1], rimP = profile(v.prof, 1, 0);
    let half = 0; for (const d of dots) half = Math.max(half, Math.abs(d.X));
    return { dots, top, rimR: rimP[0], rimY: rimP[1], half, up: -top + 0.1 };
  });
  const gm0 = j => Math.max(0.45, Math.min(1.3, j.g.rimR));
  const ivOf = s => ((Math.round(s.iv) % 8) + 8) % 8;

  let J = [], A = 0, heat = 0, mp = 0, vpn = 0, prevVpn = "up", bloomT = -99, focusKey = "", homesFor = null;
  let playAmt = 0, playAng = 0, playC = null, playKey = "", playP = 0, beamA = 0, WX = 80, WY = 50, bwS = 0;
  const RX_COL = [200, 100, 68], TX_COL = [40, 100, 58];   // download cool white-blue, upload warm gold
  const flowLvl = mb => clamp(Math.log10(1 + Math.max(0, mb) / 0.3) / 1.95, 0, 1);   // log scale, 0.02..25 Mbit/s

  // ---------- bounds a jelly's centre must keep so the whole creature stays on stage ----------
  const yLo = j => LEGACY ? 40 : TOP + j.g.up * j.r + 4;
  const yHi = j => LEGACY ? H - 120 : H - BOT - (j.g.rimY + 0.1) * j.r - TLEN * (1 - 0.2 * mp) * 0.92 - 4;
  const xLo = j => LEGACY ? 30 : Math.max(j.g.half, 0.6) * j.r * 1.15 + 4;

  // ---------- layout ----------
  function freeRegion(f) {
    const g = LEGACY ? 1 : Math.min(1, W / 1280), m1 = 50 * g, m0 = 60 * g;
    const [fx, fy, fw, fh] = f || [W, 0, 0, 0];
    const left = fx - m1 - m0, right = (W - m0) - (fx + fw + m1);
    if (left >= right) return [m0, Math.max(m0, fx - m1)];
    return [fx + fw + m1, W - m0];
  }
  function planHomes(S) {
    const JL = J.filter(j => !j.ghost), n = JL.length, slots = [];
    if (LEGACY) {   // the trial layout, unchanged
      const [x0, x1] = freeRegion(S.focus), w = x1 - x0;
      const cols = w > 320 ? 2 : 1, rows = Math.ceil(n / cols);
      for (let i = 0; i < n; i++) {
        const c = i % cols, r = Math.floor(i / cols);
        const x = x0 + (c + 0.5) / cols * w + (r % 2 ? 26 : -26) * (cols > 1 ? 1 : 0);
        const y = 120 + (r + 0.5) / rows * 420 + (c ? 34 : 0);
        slots.push([x, y]);
      }
      WX = 80; WY = 50;
    } else {        // gallery: a grid whose cells suit a tall creature, incomplete row centred
      const [x0, x1] = S.focus ? freeRegion(S.focus) : [8, W - 8], w = x1 - x0, y0 = TOP + 4, hh = H - BOT - 4 - y0;
      let cols = 1, best = 1e9;
      for (let c = 1; c <= n; c++) { const rows = Math.ceil(n / c), asp = (w / c) / (hh / rows), e = Math.abs(Math.log(asp / 0.6));
        if (e < best - 1e-9) { best = e; cols = c; } }
      const rows = Math.ceil(n / cols), cw = w / cols, ch = hh / rows;
      for (let i = 0; i < n; i++) {
        const r = Math.floor(i / cols), c = i % cols, inRow = Math.min(cols, n - r * cols);
        const x = x0 + (w - inRow * cw) / 2 + (c + 0.5) * cw + (rows > 1 ? (r % 2 ? 0.08 : -0.08) * cw : 0);
        slots.push([x, y0 + (r + 0.5) * ch, ch]);
      }
      WX = Math.min(80 * SC, cw * 0.14); WY = Math.min(50 * SC, ch * 0.08);
    }
    const free = JL.slice();
    for (const s of slots) {
      let bi = 0, bd = 1e9;
      free.forEach((j, k) => { const d = Math.hypot(j.x - s[0], j.y - s[1]); if (d < bd) { bd = d; bi = k; } });
      const j = free.splice(bi, 1)[0]; j.hx = s[0]; j.hy = s[1];
      if (!LEGACY) {   // centre the creature's whole extent (bell top .. tentacle tips) in its cell
        const up = j.g.up * j.r, down = (j.g.rimY + 0.1) * j.r + TLEN * 0.92;
        j.hy = s[1] - (down - up) / 2;
        j.hx = clamp(j.hx, xLo(j), W - xLo(j)); j.hy = clamp(j.hy, yLo(j), Math.max(yLo(j), yHi(j)));
      }
    }
    // live ghosts: no layout slot; a resting home on the right edge (V.steer supplies the real target)
    const gh = J.filter(j => j.ghost);
    gh.forEach((j, k) => { j.hx = W - xLo(j) - 18; j.hy = clamp(TOP + (H - TOP - BOT) * (k + 1) / (gh.length + 1), yLo(j), Math.max(yLo(j), yHi(j))); });
    homesFor = S.focus;
  }

  // ---------- route around the focused window (corner waypoint if the straight path crosses it) ----------
  function segHitsRect(ax, ay, bx, by, r) {
    let t0 = 0, t1 = 1; const dx = bx - ax, dy = by - ay;
    const p = [-dx, dx, -dy, dy], q = [ax - r[0], r[0] + r[2] - ax, ay - r[1], r[1] + r[3] - ay];
    for (let i = 0; i < 4; i++) {
      if (p[i] === 0) { if (q[i] < 0) return false; continue; }
      const t = q[i] / p[i];
      if (p[i] < 0) { if (t > t1) return false; if (t > t0) t0 = t; } else { if (t < t0) return false; if (t < t1) t1 = t; }
    }
    return true;
  }
  function route(j, tx, ty, f) {   // shortest path over the window's 4 padded corners (visibility graph)
    if (!f) return [tx, ty];
    const m = j.r + 46 * (LEGACY ? 1 : SC), mt = 6, T = [f[0] - mt, f[1] - mt, f[2] + 2 * mt, f[3] + 2 * mt];
    if (j.x > T[0] && j.x < T[0] + T[2] && j.y > T[1] && j.y < T[1] + T[3]) {   // inside: leave by the nearest edge
      const dl = j.x - f[0], dr = f[0] + f[2] - j.x, du = j.y - f[1], dd = f[1] + f[3] - j.y, mn = Math.min(dl, dr, du, dd);
      const ex = mn === dl ? [f[0] - m, j.y] : mn === dr ? [f[0] + f[2] + m, j.y] : mn === du ? [j.x, f[1] - m] : [j.x, f[1] + f[3] + m];
      return [clamp(ex[0], xLo(j) + 4, W - xLo(j) - 4), clamp(ex[1], yLo(j) + 6, Math.max(yLo(j) + 6, yHi(j) - 4))];
    }
    const vis = (ax, ay, bx, by) => !segHitsRect(ax, ay, bx, by, T);
    if (vis(j.x, j.y, tx, ty)) return [tx, ty];
    const N = [[j.x, j.y], [f[0] - m, f[1] - m], [f[0] + f[2] + m, f[1] - m], [f[0] - m, f[1] + f[3] + m],
      [f[0] + f[2] + m, f[1] + f[3] + m], [tx, ty]].map((c, i) => i === 0 || i === 5 ? c : [clamp(c[0], xLo(j) + 4, W - xLo(j) - 4), clamp(c[1], yLo(j) + 6, Math.max(yLo(j) + 6, yHi(j) - 4))]);
    const dist = N.map(() => 1e9), prev = N.map(() => -1), done = N.map(() => false); dist[0] = 0;
    for (let it = 0; it < 6; it++) {
      let u = -1; for (let i = 0; i < 6; i++) if (!done[i] && (u < 0 || dist[i] < dist[u])) u = i;
      if (u < 0 || dist[u] >= 1e9) break; done[u] = true;
      for (let v = 0; v < 6; v++) if (!done[v] && vis(N[u][0], N[u][1], N[v][0], N[v][1])) {
        const d = dist[u] + Math.hypot(N[u][0] - N[v][0], N[u][1] - N[v][1]); if (d < dist[v]) { dist[v] = d; prev[v] = u; } }
    }
    if (prev[5] < 0) return [tx, ty];
    let v = 5; while (prev[v] !== 0) v = prev[v];
    const w = N[v], dx = w[0] - j.x, dy = w[1] - j.y, d = Math.hypot(dx, dy) || 1;
    return d < 140 ? [w[0] + dx / d * 30, w[1] + dy / d * 30] : w;   // overshoot a little so corners are rounded
  }

  // live: state of each creature at the start of init, restored by id in carry
  let snap = new Map();
  function init(V, S) {
    snap = new Map(); if (V.LIVE) for (const j of J) snap.set(j.id, j);
    scales();
    J = V.sessions.map((s, i) => ({
      ghost: !!(V.LIVE && s.ghost),
      id: s.id, hue: s.hue, i, x: 0, y: 0, vx: 0, vy: 0, hx: 0, hy: 0,
      cpu: S.s[s.id].cpu, r: rad(S.s[s.id].mem), bright: S.s[s.id].state === "idle" ? 0 : 1, needs: 0,
      nT: clamp(S.s[s.id].procs, 1, NTMAX), phase: (i * 0.37) % 1, c: 0, wt: i * 3.1, wx: 0, wy: 0, tw: i * 2,
      jx: 0, jy: 0, tilt: 0, tent: [], rxP: [], txP: [], rxAcc: 0, txAcc: 0, rxTok: 0, txN: 0, rxN: 0, rxC: 0, txC: 0, jam: 0, ch: i * 1.7,
      embers: [], eAcc: 0, ripples: [], ripAcc: 1.2,
      knock: 0, v: VARS[ivOf(s)], g: GEO[ivOf(s)], iv: ivOf(s),
    }));
    J.forEach(j => { j.tent = []; for (let k = 0; k < NTMAX; k++) j.tent.push(new Float32Array(NB * 2)); });
    A = clamp(S.m.level / 3, 0, 1); heat = S.m.thermal / 2; mp = S.m.mempress / 2;
    vpn = S.net.vpn === "down" ? 1 : 0; prevVpn = S.net.vpn; bloomT = -99; playAmt = 0; playAng = 0; playC = null;
    playKey = ""; playP = 0; beamA = 0; bwS = 0;
    focusKey = (S.focus || []).join(); planHomes(S);
    J.forEach(j => { j.x = j.hx; j.y = j.hy; });
    J.forEach(j => buildTentacles(j, 0));
  }
  // live: surviving creatures keep position, velocity and rhythm; newcomers start at their home
  const KEEP = ["x", "y", "vx", "vy", "cpu", "r", "bright", "needs", "nT", "phase", "c", "wt", "tw", "ch", "tilt",
    "rxP", "txP", "rxAcc", "txAcc", "rxTok", "txTok", "rxC", "txC", "jam", "embers", "eAcc", "ripples", "ripAcc", "knock"];
  function carry(V, S, prev) {
    const keep = new Set();
    for (const j of J) {
      const o = snap.get(j.id);
      if (o) { for (const k of KEEP) if (k in o) j[k] = o[k]; keep.add(j.id); }
      else if (prev[j.id]) { j.x = prev[j.id].x; j.y = prev[j.id].y; keep.add(j.id); }
    }
    planHomes(S);   // slots re-matched to where the survivors are now
    for (const j of J) { if (!keep.has(j.id)) { j.x = j.hx; j.y = j.hy; j.vx = 0; j.vy = 0; } buildTentacles(j, V.t); }
    snap = new Map();
  }
  // live: PSZ() eased by the Size slider; tentacle length follows, homes re-planned (bell radius reads PSZ() per frame)
  function resize(V, S) {
    TLEN = 118 * PSZ() * SC * (LEGACY ? 1 : 0.78);
    if (J.length && S) planHomes(S);
  }
  // live: burning-item running lights along the front of the bell skirt, just under the rim
