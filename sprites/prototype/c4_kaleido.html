    c.breath += dt * TAU / 7;

    c.rx += ((st.rx || 0) - c.rx) * ease(dt, 0.5); c.tx += ((st.tx || 0) - c.tx) * ease(dt, 0.5);
    c.lin = netLvl(c.rx); c.lout = netLvl(c.tx); c.jam = clamp(G.bw, 0, 1) * clamp((c.rx + c.tx) / 2, 0, 1) * (1 - vd);
    const stut = 1 - c.jam * (V.vnoise(t * 2.6 + i * 3, 4.4) > 0.5 ? 0.95 : 0.55);
    c.phIn += dt * (0.32 + 0.3 * c.lin) * stut * (1 - vd); c.phOut += dt * (0.32 + 0.3 * c.lout) * stut * (1 - vd);
    if (c.bloom > 0) c.bloom = Math.max(0, c.bloom - dt / 1.6);
    // idle drift: slow wander about home (the only data-free motion besides play), stops when VPN lost
    c.nt += dt * 0.07 * P.drift * (1 - vd);
    const g = V.H / 800;
    let tx = c.home[0] + (V.vnoise(c.nt + i * 9.1, 3.3) - 0.5) * 80 * g, ty = c.home[1] + (V.vnoise(c.nt + i * 4.7, 8.8) - 0.5) * 50 * g;
    // VPN: huddle toward the group centre
    { const rk = G.rank ? G.rank[i] : i, Ra = G.Ravg || c.R, ang = rk * 2.4 + 0.6, dd = rk ? Math.sqrt(rk) * Ra * 0.7 : 0;
      const hk = (V.LIVE && V.huddlePt ? 1 : 0.9) * vd * G.hud;
      if (!c.ghost) tx += (G.hx + Math.cos(ang) * dd - tx) * hk; if (!c.ghost) ty += (G.hy + Math.sin(ang) * dd * 0.8 - ty) * hk; }
    // play: the pair drift together, make one short twirl about their shared centre, part (no exchange)
    if (G.pa > 0.002 && (i === G.ia || i === G.ib)) {
      const A = C[G.ia], B = C[G.ib], d = A.R + B.R + 16 * g, mx = (A.home[0] + B.home[0]) / 2, my = (A.home[1] + B.home[1]) / 2;
      const sg = i === G.ia ? 1 : -1, ox = Math.cos(G.pAng) * d / 2 * sg, oy = Math.sin(G.pAng) * d / 2 * sg;
      tx += (mx + ox - tx) * sm(G.pa); ty += (my + oy - ty) * sm(G.pa);
    }
    // needs-you: rise to just under the menu bar
    if (c.need > 0.002 && !c.ghost && V.on("needsApproach")) { const kp = knockSpot(V, f, c, taken); tx += (kp[0] - tx) * sm(c.need); ty += (kp[1] - ty) * sm(c.need); }
    if (V.LIVE) [tx, ty] = V.steer(c.id, tx, ty, c.R);
    if (V.LIVE) [tx, ty] = (c.need < 0.5 ? V.nav : V.navNeed)(c.id, c.x, c.y, tx, ty, c.need < 0.5 ? ringMax(V, c.R) * 0.8 : c.R * 1.15);   // fit + reachable + around the focus (needs-you: round it to the knock spot)
    const tau = c.need > 0.05 ? 0.55 : (V.LIVE && V.huddlePt && vd > 0.5 && G.hud) ? 0.4 : (G.pa > 0.3 && (i === G.ia || i === G.ib)) ? 0.3 : 0.6;
    let nx = c.x + (tx - c.x) * ease(dt, tau), ny = c.y + (ty - c.y) * ease(dt, tau);
    const mv = Math.hypot(nx - c.x, ny - c.y), cap = 700 * g * dt; if (mv > cap) { nx = c.x + (nx - c.x) * cap / mv; ny = c.y + (ny - c.y) * cap / mv; }
    c.x = nx; c.y = ny;
    if (c.need < 0.5 && (vd < 0.5 || (V.LIVE && V.huddlePt))) { const a = V.avoid(c.x, c.y, 50 * g + c.R); c.x += a[0] * 1.8; c.y += a[1] * 1.8; }
    const amp = Math.pow(s, 1.5) * 3.2 * (1 - vd) * G.sa;
    c.jx = (V.vnoise(t * 11 + i * 5.5, 1.7) - 0.5) * 2 * amp; c.jy = (V.vnoise(t * 11 + i * 3.1, 9.2) - 0.5) * 2 * amp;
    // thermal embers
    c.emberAcc += dt * S.m.thermal * 3 * P.density * (1 - vd);
    while (c.emberAcc >= 1) { c.emberAcc -= 1; const a = V.rand() * TAU, rr = c.R * 0.65 * Math.sqrt(V.rand());
      M.push({ kind: 2, x: c.x + Math.cos(a) * rr, y: c.y + Math.sin(a) * rr, vx: (V.rand() - 0.5) * 6, vy: -6 - 6 * V.rand(), life: 0, max: 0.9 + 0.5 * V.rand(), h: 6 + 12 * V.rand(), sz: 2 }); }
  });
  // separation: seeds never overlap (play pair excepted: they mesh at rim distance)
  for (let i = 0; i < C.length; i++) for (let j = i + 1; j < C.length; j++) {
    const A = C[i], B = C[j]; if (A.ghost || B.ghost) continue;
    const pair = G.pa > 0.05 && ((i === G.ia && j === G.ib) || (i === G.ib && j === G.ia));
    if (pair) continue;
    const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy) || 1e-3, want = (A.R + B.R) * (1.18 - 0.85 * G.vd * G.hud) + 14 * V.H / 800 * (1 - G.vd * G.hud);
    if (d < want) { const k = (want - d) * 0.5 * Math.min(1, 6 * dt); A.x -= dx / d * k; A.y -= dy / d * k; B.x += dx / d * k; B.y += dy / d * k; } }
  // particles
  for (const m of M) { m.life += dt;
    m.x += m.vx * dt; m.y += m.vy * dt; if (m.kind === 0) { m.vx *= 0.97; m.vy *= 0.97; } }
  C.forEach(c => V.report(c.id, c.x + c.jx, c.y + c.jy, c.R * 1.12));
  M = M.filter(m => m.life < m.max); if (M.length > 700) M.splice(0, M.length - 700);
}

// ---------- drawing ----------
function draw(V, S, ctx) {
  const t = V.t, P = V.P, s = G.strain, vd = G.vd;

  ctx.globalCompositeOperation = "lighter";
  if (vd > 0.02 && G.hud && !V.LIVE) drawBeam(V, S, ctx, vd);
  C.forEach((c, i) => {
    const st = S.s[c.id]; if (!st) return;
    V.creature(c.id, () => {
    const x = c.x + c.jx, y = c.y + c.jy, R = c.R, k = c.k, act = c.act;
    const br = c.need > 0.01 ? 0.5 + 0.5 * Math.sin(TAU * 0.45 * t) : 0;
    const bl = c.bloom > 0 ? Math.sin(Math.PI * (1 - c.bloom)) : 0;
    const open = (0.62 + 0.38 * Math.max(act, c.need)) * (1 - 0.6 * vd) + 0.12 * c.need * br + 0.35 * bl;
    const satB = 80 * (1 - 0.45 * vd), lumB = (50 + 12 * act + 8 * c.need * br) * (1 - 0.18 * vd);
    const calm = clamp(1 - act - c.need, 0, 1), aB = (0.42 + 0.48 * act + 0.2 * c.need) * (1 - 0.25 * vd) * (1 - 0.12 * calm * (0.5 + 0.5 * Math.sin(c.breath)));
    // machine strain: red ember glow behind and inside the seed, rising with level (no rings, no flashing)

      glow(V, ctx, 4, 92, 46, x, y, R * 2.0, 0.65 * es); glow(V, ctx, 10, 95, 50, x, y, R * 1.15, 0.75 * es);
      glow(V, ctx, 0, 95, 52, x, y, R * 0.55, 0.5 * es); }
    const mp = S.m.mempress;

    glow(V, ctx, c.hue, satB, 55, x, y, R * 1.55, (0.10 + 0.12 * act + 0.22 * c.need * br + 0.35 * bl) * P.glow);
    // --- outer dot rings: count = memory; squeeze inward with memory pressure; broken by VPN loss
    for (let j = 0; j < c.nr; j++) {
      const rr = R * (0.86 + 0.14 * (c.nr > 1 ? j / (c.nr - 1) : 0.5)) * (1 - 0.05 * mp * (j + 1));
      const n = Math.max(8, Math.round(k * (3 + j) * P.density)), ang0 = c.rot2 * (j % 2 ? -1 : 1) * (1 + 0.25 * j);
      ctx.fillStyle = V.hsl(c.hue, satB * 0.9 + 10 * vd, lumB + 6, aB * (0.55 - 0.08 * j));
      for (let d = 0; d < n; d++) { const a = ang0 + d * TAU / n;
        if (vd > 0.02) { const ph = ((a % (TAU / 3)) + TAU / 3) % (TAU / 3); if (ph < vd * 0.3 * TAU / 3) continue; }
        ctx.fillRect(x + Math.cos(a) * rr - dsz * 0.4, y + Math.sin(a) * rr - dsz * 0.4, dsz * 0.8, dsz * 0.8); }
    }
    // --- the seed's figure (its variant: shape family + symmetry order k), drawn arm by arm so that
    //     spin + outward chase = CPU and per-arm angle/length jitter = strain apply to every form alike
    const F = c.F, PR = R * 0.78 * open, wid = 0.55 + 0.45 * open;
    const inR = R * (0.7 + 0.3 * open);
    for (let p = 0; p < k; p++) {
      const s15 = Math.pow(s, 1.5) * G.sa, brk = s15 * 0.55 * (V.vnoise(p * 7.3 + k, t * 2.4) - 0.5) * 2;
      const a = c.rot + p * TAU / k + brk, ca = Math.cos(a), sa = Math.sin(a);
      const tipR = PR * (1 + s15 * 0.32 * (V.vnoise(p * 3.1 + 40, t * 3.1) - 0.5) * 2);
      const ox = x + s15 * R * 0.13 * (V.vnoise(p * 5.7 + 11, t * 2.9) - 0.5) * 2, oy = y + s15 * R * 0.13 * (V.vnoise(p * 4.3 + 71, t * 2.7) - 0.5) * 2;
      const flick = G.sa && s > 0.3 && V.vnoise(p * 13, t * 9) > 0.62 ? 1 - 0.55 * (s - 0.3) : 1;
      for (const [X, Y0, u] of F.arm) { const Y = Y0 * wid, ch = 0.5 + 0.5 * Math.cos(TAU * (u - c.chase));
        const al = aB * (0.5 + 0.5 * act * ch * ch) * flick;
        ctx.fillStyle = V.hsl(mixHue(c.hue, 6, 0.75 * s * (1 - 0.5 * u)), satB, lumB + 14 * u + 6 * s, al);
        ctx.fillRect(ox + (X * ca - Y * sa) * tipR - dsz / 2, oy + (X * sa + Y * ca) * tipR - dsz / 2, dsz, dsz); }
      for (const [X, Y0] of F.tips) { const Y = Y0 * wid;
        glow(V, ctx, mixHue(c.hue, 6, 0.5 * s), satB, 62, ox + (X * ca - Y * sa) * tipR, oy + (X * sa + Y * ca) * tipR,

      if (F.inner.length) {   // inner kaleidoscope layer, counter-turning, offset by half an arm

        ctx.fillStyle = V.hsl(c.hue, satB * 0.85, lumB + 16, aB * 0.62);

    }
    // --- network: beads along the seed's own arms. IN (download) = cool white-blue, rim -> core, on the arm axes;
    //     OUT (upload) = warm gold, core -> rim, between the arms. More Mbit/s = more, bigger, brighter beads (log).
    //     Jam (link too slow): beads stall and pile up in a bright clogged band at the rim, stuttering.
    drawBeads(V, ctx, c, x, y, R * 0.8 * (0.8 + 0.2 * open), c.lin, c.phIn, 1, 0);
    drawBeads(V, ctx, c, x, y, R * 0.8 * (0.8 + 0.2 * open), c.lout, c.phOut, -1, 0.5);
    if (c.jam > 0.03) { const n = 3 * k, rr = R * 0.8;
      for (let d = 0; d < n; d++) { const a = c.rot + d * TAU / n, fl = V.vnoise(d * 3.3 + i, t * 7) > 0.45 ? 1 : 0.45;
        glow(V, ctx, 48, 40, 84, x + Math.cos(a) * rr, y + Math.sin(a) * rr, 6 * Math.sqrt(P.size), 0.55 * c.jam * fl * (1 - vd)); } }

    const np = Math.round(c.procs), orR = R * 1.02 + 9 * Math.sqrt(P.size);
    ctx.fillStyle = V.hsl(c.hue, satB * 0.8, 72, 0.55 + 0.35 * act);

      ctx.fillRect(sx - px, sy - px * 0.5, px * 2, px); ctx.fillRect(sx - px * 0.5, sy - px, px, px * 2); }
    // --- needs-you: slow soft rings out of the seed (0.45 Hz, smooth envelope)
    if (c.need > 0.02) for (let j = 0; j < 2; j++) {
      const u = ((t / 2.2) + j * 0.5) % 1, rad = R * 1.15 + u * (0.6 * R + 18 * V.H / 800), al = Math.sin(Math.PI * u) * 0.45 * c.need;
      ctx.strokeStyle = V.hsl(c.hue, 85, 66, al * P.glow); ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.stroke();
      ctx.strokeStyle = V.hsl(c.hue, 70, 82, al); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.stroke(); }
    // --- reconnect bloom ring
    if (bl > 0.01) { ctx.strokeStyle = V.hsl(c.hue, 90, 72, bl * 0.7); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, R * (1.1 + 1.8 * (1 - c.bloom)), 0, TAU); ctx.stroke(); }
    });
  });
  // particles: bloom motes, heat sparks (inside the seed)
  for (const m of M) { const u = m.life / m.max, a = Math.sin(Math.PI * Math.min(1, u * 1.2)) * (m.kind === 2 ? 0.7 : 0.9);
    ctx.fillStyle = m.kind === 2 ? V.hsl(m.h, 95, 60, a) : V.hsl(m.h, 85, 72, a);
    const z = m.sz * Math.sqrt(P.size); ctx.fillRect(m.x - z / 2, m.y - z / 2, z, z); }
  if (vd > 0.02 && G.hud && !V.LIVE) drawBeacon(V, ctx, vd);
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
}
function drawBeam(V, S, ctx, vd) {   // slow searching beam from the huddle, never over the focused window
  const f = S.focus; ctx.save();
  if (f) { ctx.beginPath(); ctx.rect(0, 0, V.W, V.H); ctx.rect(f[0] - 6, f[1] - 6, f[2] + 12, f[3] + 12); ctx.clip("evenodd"); }
  const a = G.beam, L = 300 * Math.max(0.6, V.H / 800), sp = 0.17, x = G.hx, y = G.hy;
  const g = ctx.createRadialGradient(x, y, 10, x, y, L);
  g.addColorStop(0, V.hsl(205, 35, 70, 0.13 * vd)); g.addColorStop(1, V.hsl(205, 35, 70, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, L, a - sp, a + sp); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawBeads(V, ctx, c, x, y, rim, lvl, ph, dir, off) {
  if (lvl < 0.03) return;
  const P = V.P, k = c.k, n = 1 + Math.round(3 * lvl), jam = c.jam, ex = 1 + 4 * jam;
  const z = (1.8 + 2.6 * lvl) * Math.sqrt(P.size), r0 = c.R * 0.16;
  const h = dir > 0 ? 205 : 44, sat = dir > 0 ? 55 : 92, lum = dir > 0 ? 86 : 66, al = (0.35 + 0.65 * lvl) * (1 - G.vd);
  for (let p = 0; p < k; p++) { const a = c.rot + (p + off) * TAU / k, ca = Math.cos(a), sa = Math.sin(a);
    for (let j = 0; j < n; j++) { const f = (ph + j / n + p * 0.37 / k) % 1;
      let pos = dir > 0 ? 1 - Math.pow(f, ex) : 1 - Math.pow(1 - f, ex);    // radial 0 = core, 1 = rim; jam bunches at the rim
      const env = Math.sin(Math.PI * Math.min(1, f * 1.15 + 0.02)) * (1 - jam) + jam, r = r0 + (rim - r0) * pos;
      const bx = x + ca * r, by = y + sa * r;
      glow(V, ctx, h, sat, lum, bx, by, z * 3.4, al * env * 0.9 * P.glow);
      ctx.fillStyle = V.hsl(h, sat, lum + 6, al * env); ctx.fillRect(bx - z / 2, by - z / 2, z, z);

      const tl = (1 - jam) * (rim - r0) * 0.07;
      for (let e = 1; e <= 3; e++) { const rt = r + dir * tl * e, zz = z * (1 - 0.22 * e);
        ctx.fillStyle = V.hsl(h, sat, lum, al * env * (0.55 - 0.15 * e)); ctx.fillRect(x + ca * rt - zz / 2, y + sa * rt - zz / 2, zz, zz); } } } }
function drawBeacon(V, ctx, vd) {   // a small red beacon blinking above the huddle (flash 0.18 s every 1.3 s)
  const u = (V.t % 1.3) / 1.3, on = u < 0.14 ? 1 : 0.12, px = 2.6 * Math.sqrt(V.P.size);
  const x = G.hx, y = Math.max(V.TOP + 8, G.hy - Math.max(...C.map(c => c.R)) * 1.25 - 8);
  glow(V, ctx, 0, 95, 55, x, y, 14 * Math.sqrt(V.P.size), 0.9 * on * vd);
  ctx.fillStyle = V.hsl(0, 95, 62, (0.3 + 0.7 * on) * vd); ctx.fillRect(x - px, y - px, 2 * px, 2 * px);
  ctx.fillStyle = V.hsl(0, 30, 35, 0.6 * vd); ctx.fillRect(x - px * 0.5, y + px, px, px * 2.2); }
function place(V, id, x, y) { const c = C.find(q => q.id === id); if (c) { c.x = x; c.y = y; } }
V.piece({ init, carry, lightSpots, step, draw, place });
})();
