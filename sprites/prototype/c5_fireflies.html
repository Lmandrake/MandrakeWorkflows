<!doctype html>
<html><head><meta charset="utf-8"><title>C5 Firefly Murmurations</title></head><body>
<script id="COLOPHON" type="application/json">[
"One firefly swarm per session; its colour (and the pixel-cross queen at its heart) = the session",
"How many fireflies (swarm area) = memory; swirl speed and streak length = CPU; pixel diamonds orbiting = background tasks, one each",
"Dim, slow, barely twinkling cloud = idle; bright fast figure = working; swarm flies to the front window and sends slow ripples = needs you",
"Network, inside the swarm: cool white-blue packets stream INWARD along the flight figure into the heart = download; warm gold packets stream OUTWARD from the heart to the rim = upload; more Mbit/s = more, brighter packets. Link too slow: packets stall, stutter and jam into bright clots at the rim; packets fading midway = loss",
"Machine strain (level, thermal, memory pressure): a red ember glow behind and inside the swarm, and its figure slips out of register as if noise were added",
"VPN down: every swarm drains to cold grey, huddles and stops, a small red beacon blinks, a searchlight sweeps; one bloom on reconnect. Play: two idle swarms drift together, circle once, part. Halos are decoration; swarms keep clear of the front window",
"Individualizer (identity, not data): the figure a swarm flies (galaxy, halo, infinity, coil, lissajous, trefoil, comet, braid), its faint ghost path, and its firefly shape (round, square, cross, diamond)"
]</script>
<script src="timelines.js"></script>
<script src="scenarios.js"></script>
<script src="size_norm.js"></script>
<script src="visitors_runtime.js"></script>
<script>
V.piece((function () {
  "use strict";
  const TAU = Math.PI * 2, W = V.W, H = V.H, P = V.P;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const ease = (dt, tau) => 1 - Math.exp(-dt / tau);
  const lerp = (a, b, f) => a + (b - a) * f;
  const PER_GB = 38;                       // fireflies per GB of footprint (x density)
  // Gallery cells (chrome=0 or a small stage) get a grid layout and bigger swarms; the 1280x800 trial keeps its layout.
  // Live mode (live=1, a real desktop ~1728x1117): the gallery geometry, creatures at the trial size x min(W/1280,H/800).
  const LV = !!V.LIVE, SC = Math.min(W / 1280, H / 800);
  let GAL = LV || V.TOP === 0 || H < 700;
  // Individualizer: the flight figure each swarm traces + the shape of its motes. Identity in one colour.
  const VARIANT_NAMES = ["Galaxy", "Halo", "Infinity", "Coil", "Lissajous", "Trefoil", "Comet", "Braid"];
  window.VARIANT_NAMES = VARIANT_NAMES;
  const SHAPE = ["round", "square", "cross", "diamond", "round", "diamond", "cross", "square"];
  const OPEN = [0, 0, 0, 1, 0, 0, 0, 1];   // open figures: motes fade in/out at the ends
  const PHI = 0.6180339887;
  const frac = x => x - Math.floor(x);
  // unit figure, extent about 1: returns [x, y, endFade]
  function figure(iv, th, j) {
    switch (iv) {
      case 1: return [0.86 * Math.cos(th), 0.86 * Math.sin(th), 1];
      case 2: { const d = 1 + Math.sin(th) ** 2; return [1.12 * Math.cos(th) / d, 1.5 * Math.sin(th) * Math.cos(th) / d, 1]; }
      case 3: { const u = frac(th / TAU), w = 4 * TAU * u;
        return [(2 * u - 1) * 0.92 + 0.24 * Math.cos(w), 0.46 * Math.sin(w), Math.sin(Math.PI * u)]; }
      case 4: return [0.9 * Math.sin(3 * th + Math.PI / 2), 0.86 * Math.sin(2 * th), 1];
      case 5: return [(Math.sin(th) + 2 * Math.sin(2 * th)) / 3.1, (Math.cos(th) - 2 * Math.cos(2 * th)) / 3.1 + 0.05, 1];
      case 7: { const u = frac(th / TAU), k = j % 3;
        return [0.42 * Math.sin(1.5 * TAU * u + k * TAU / 3), (2 * u - 1) * 0.98, Math.sin(Math.PI * u)]; }
    }
    return [Math.cos(th), Math.sin(th), 1];
  }
  let MAXM = Math.ceil(2.6 * PER_GB * P.density) + 2; const MAXL = 12;

  let SW = [], embers = [];
  let vpnAmt = 0, prevVpn = "up", bloomT = -99, strain = 0, agit = 0, playAmt = 0, playPhi = 0;
  let huddle = [W / 2, GAL ? H - V.BOT - (H - V.TOP - V.BOT) * 0.2 : 600], beamPh = 0, heartPh = 0;

  // glow sprites, cached by quantised colour (sat multiplier is fixed per run, so caching is safe)
  const sprites = new Map();
  function sprite(h, s, l) {
    h = ((Math.round(h / 3) * 3) % 360 + 360) % 360; s = Math.round(s / 5) * 5; l = Math.round(l / 4) * 4;
    const k = h + "_" + s + "_" + l + (V.cur && V.cur.white ? "w" : ""); let c = sprites.get(k); if (c) return c;
    c = document.createElement("canvas"); c.width = c.height = 48; const g = c.getContext("2d");
    const gr = g.createRadialGradient(24, 24, 0, 24, 24, 24);
    gr.addColorStop(0, V.hsl(h, s, Math.min(95, l + 18), 0.9)); gr.addColorStop(0.14, V.hsl(h, s, l, 0.55));
    gr.addColorStop(0.38, V.hsl(h, s, l, 0.16)); gr.addColorStop(0.7, V.hsl(h, s, l, 0.04)); gr.addColorStop(1, V.hsl(h, s, l, 0));
    g.fillStyle = gr; g.fillRect(0, 0, 48, 48); sprites.set(k, c); return c;
  }

  function freeRect(f) {           // the side of the screen away from the focused window
    if (!GAL) {                    // trial layout (1280x800 with menu bar and dock), as shipped
      const m = 110 * Math.min(1.4, P.size);
      if (!f) return [140, 90, W - 280, 580];
      const [fx, , fw] = f, focusRight = fx + fw / 2 > W / 2;
      if (focusRight) { const x1 = Math.max(220, fx - m); return [70, 90, x1 - 70, 580]; }
      const x0 = Math.min(W - 220, fx + fw + m); return [x0, 90, W - 70 - x0, 580];
    }
    const mx = W * 0.07, y0 = V.TOP + (H - V.TOP - V.BOT) * 0.1, hh = (H - V.TOP - V.BOT) * 0.8;
    if (!f) return [mx, y0, W - 2 * mx, hh];
    const [fx, , fw] = f, focusRight = fx + fw / 2 > W / 2, m = W * 0.07;
    if (focusRight) { const x1 = Math.max(W * 0.2, fx - m); return [W * 0.05, y0, x1 - W * 0.05, hh]; }
    const x0 = Math.min(W * 0.8, fx + fw + m); return [x0, y0, W * 0.95 - x0, hh];
  }
  // home positions: trial = two zig-zag columns; gallery = the grid that gives the roomiest cells
  function homesFor(fr, n) {
    if (!GAL) return Array.from({ length: n }, (_, i) => [fr[0] + fr[2] * (i % 2 ? 0.74 : 0.26), fr[1] + (i + 0.5) / n * fr[3]]);
    let best = null;
    for (let c = 1; c <= n; c++) { const r = Math.ceil(n / c), cm = Math.min(fr[2] / c, fr[3] / r);
      if (!best || cm > best.cm + 0.5) best = { c, r, cm }; }
    const out = [];
    for (let i = 0; i < n; i++) { const row = Math.floor(i / best.c), inRow = Math.min(best.c, n - row * best.c), col = i - row * best.c;
      out.push([fr[0] + fr[2] * (col + 0.5 + (best.c - inRow) / 2) / best.c, fr[1] + fr[3] * (row + 0.5) / best.r]); }
    return out;
  }
  // radius per sqrt(GB): fixed per run (stage + session count), never per datum
  function unitR() {
    if (!GAL) return 33;
    const fr = freeRect(null), n = LV ? Math.max(1, V.sessions.filter(s => !V.isGhost(s.id)).length) : V.sessions.length; let cm = 0;
    for (let c = 1; c <= n; c++) cm = Math.max(cm, Math.min(fr[2] / c, fr[3] / Math.ceil(n / c)));
    return LV ? Math.min(33 * SC, cm * 0.27) : Math.min(H * 0.19, cm * 0.27);
  }
  let R1, KS;   // KS: pixel scale of motes/halos
  function layout() {   // per run (stage + session count); recomputed on every init (live membership changes)
    GAL = LV || V.TOP === 0 || H < 700; MAXM = Math.ceil(2.6 * PER_GB * P.density) + 2;
    R1 = unitR(); KS = LV ? clamp(SC, 1, 1.5) : GAL ? Math.max(1, Math.min(1.5, R1 / 30)) : 1;
  }
  layout();
  // live: a snapshot taken at the start of init, restored by id in carry (swarms keep position, phase and motes)
  let snap = null;
  const KEEP = ["x", "y", "vx", "vy", "cpu", "mem", "work", "needs", "R", "ph", "lph", "dir", "rx", "tx", "jam", "acc", "pk", "motes", "lan", "jx", "jy"];
  // ghosts (live only) take no part in homes, huddle, play or separation; k = rank among the others
  function rankAll() { let k = 0; SW.forEach(sw => { sw.ghost = LV && V.isGhost(sw.id); sw.k = sw.ghost ? -1 : k++; }); return k; }

  function init(V, S) {
    if (LV) snap = { sw: new Map(SW.map(sw => [sw.id, sw])), g: { vpnAmt, prevVpn, bloomT, strain, agit, playAmt, playPhi, beamPh, heartPh, embers } };
    layout();
    SW = []; embers = [];
    vpnAmt = S.net.vpn === "down" ? 1 : 0; prevVpn = S.net.vpn; bloomT = -99; strain = 0; playAmt = 0; playPhi = 0;
    beamPh = 0; heartPh = 0;
    const fr = freeRect(S.focus), gh = V.sessions.map(ss => LV && V.isGhost(ss.id)), n = gh.filter(g => !g).length;
    const homes = homesFor(fr, n); let k = 0;
    V.sessions.forEach((ss, i) => {
      const d = S.s[ss.id];
      const motes = [];
      for (let j = 0; j < MAXM; j++) {
        const rr = 0.18 + 0.82 * Math.sqrt(V.rand()), arm = (j % 2) * Math.PI;
        const m = { rr, th: arm + rr * 2.2 + (V.rand() - 0.5) * 1.9, bp: V.rand(), fr: 0.6 + 0.8 * V.rand(),
          seed: V.rand() * 1000, x: 0, y: 0, px: 0, py: 0, a: 0, sz: 0.8 + 0.5 * V.rand(), env: 1 };
        // figure variants: golden-ratio spacing, so whatever prefix memory lights is spread evenly over the figure
        m.u = frac(j * PHI); m.ox = Math.cos(m.seed) * Math.sqrt(m.bp); m.oy = Math.sin(m.seed) * Math.sqrt(m.bp);
        motes.push(m);
      }
      const lan = [];
      for (let j = 0; j < MAXL; j++) lan.push({ th: 0, x: 0, y: 0, a: j < d.procs ? 1 : 0, wob: V.rand() * 10 });
      const [hx, hy] = gh[i] ? [W - R1 * 1.5 - 18, V.TOP + (H - V.TOP - V.BOT) / 2] : homes[k++], iv = ((ss.iv | 0) % 8 + 8) % 8, tilt = (V.rand() - 0.5) * 1.2;
      SW.push({ id: ss.id, hue: ss.hue, i, iv, ph: 0, dir: i % 2 ? -1 : 1, tilt: iv === 0 ? tilt : 0,
        x: hx, y: hy, vx: 0, vy: 0, cpu: d.cpu, mem: d.mem, procs: d.procs,
        work: d.state === "working" ? 1 : 0, needs: d.state === "needs" ? 1 : 0, R: 20, motes, lan, jx: 0, jy: 0,
        lph: V.rand() * TAU, rx: 0, tx: 0, jam: 0, acc: [0, 0], pk: [] });
    });
    SW.forEach(sw => placeMotes(sw, 0, 0));
    SW.forEach(sw => sw.motes.forEach(m => { m.px = m.x; m.py = m.y; }));
  }

  function carry(V, S, prev) {
    if (!snap) return;
    SW.forEach(sw => { const o = snap.sw.get(sw.id);
      if (o) { KEEP.forEach(key => { sw[key] = o[key]; }); if (o.iv === sw.iv) sw.tilt = o.tilt; }
      else if (prev[sw.id]) { sw.x = prev[sw.id].x; sw.y = prev[sw.id].y; } });
    ({ vpnAmt, prevVpn, bloomT, strain, agit, playAmt, playPhi, beamPh, heartPh, embers } = snap.g); snap = null;
  }
  // running lights: a short tail hanging just under the figure's own lowest lit motes (not the halo radius: a wide
  // figure such as Infinity is much flatter than R, so an R-based offset left the pips floating well below it)
  function lightSpots(V, id, n) {
    const sw = SW.find(s => s.id === id); if (!sw) return null;
    let yb = -1e9, xs = 0, k = 0;
    for (const m of sw.motes) if (m.a > 0.3) { if (m.y > yb) yb = m.y; xs += m.x; k++; }
    const cx = k ? xs / k : sw.x + sw.jx; if (!k) yb = sw.y + sw.jy + sw.R * 0.6;
    const gap = 5 * KS * Math.sqrt(P.size), y0 = yb + 7 * KS * Math.sqrt(P.size);
    return Array.from({ length: n }, (_, j) => [cx + gap * (j - (n - 1) / 2), y0 + gap * 0.18 * Math.sin(j * 1.3)]);
  }

  function bloomEnv() { const d = V.t - bloomT; if (d < 0 || d > 2.2) return 0; return Math.min(1, d / 0.25) * Math.exp(-d / 0.55); }

  function placeMotes(sw, dt, t) {
    const R = sw.R, work = sw.work, bl = bloomEnv();
    const spin = sw.dir * (0.16 + 0.95 * sw.cpu) * (0.35 + 0.65 * work) * (1 - 0.93 * vpnAmt) * (1 + 0.5 * agit);
    const ct = Math.cos(sw.tilt), st = Math.sin(sw.tilt), loose = (1 - work) * (1 - vpnAmt);
    if (sw.iv !== 0) { placeFigure(sw, dt, t, spin, loose, bl); return; }
    sw.ph += spin * dt;
    sw.motes.forEach((m, j) => {
      m.th += spin * (1.05 - 0.1 * m.rr) * dt;
      let r = R * m.rr * (1 + 0.1 * Math.sin(m.seed + t * 0.7)) * (1 - 0.38 * vpnAmt) * (1 + 1.9 * bl);
      r = lerp(r, R * (0.92 + 0.08 * m.rr), sw.needs * 0.75);
      let lx = Math.cos(m.th) * r, ly = Math.sin(m.th) * r * lerp(0.7, 1, sw.needs);
      let x = lx * ct - ly * st, y = lx * st + ly * ct;
      const wt = t * (0.1 + 0.15 * sw.work) * P.drift;
      x += (V.vnoise(m.seed, wt) - 0.5) * R * 0.9 * loose; y += (V.vnoise(m.seed + 50, wt) - 0.5) * R * 0.9 * loose;
      if (agit > 0.02) { const jt = t * 2.2; x += (V.vnoise(m.seed * 1.7, jt) - 0.5) * 9 * KS * agit; y += (V.vnoise(m.seed * 2.3, jt + 9) - 0.5) * 9 * KS * agit; x += misreg(sw, y, t); }
      m.px = m.x; m.py = m.y; m.x = sw.x + sw.jx + x; m.y = sw.y + sw.jy + y;
    });
    placeLanterns(sw, dt, t, work, bl);
  }
  function figScale(sw, bl) { return sw.R * 1.1 * (1 - 0.38 * vpnAmt) * (1 + 1.9 * bl) * (1 + 0.06 * sw.needs); }
  // variants 1..7: motes stream along the variant's figure; speed along it = CPU (same spin as the galaxy)
  function placeFigure(sw, dt, t, spin, loose, bl) {
    const R = sw.R, S = figScale(sw, bl), wt = t * (0.1 + 0.15 * sw.work) * P.drift;
    sw.ph += spin * 0.9 * dt;
    sw.motes.forEach((m, j) => {
      let x, y, env = 1;
      if (sw.iv === 6) {   // comet: a bright head on a circular track, its tail strung out behind and fraying
        const o = Math.pow(m.u, 1.7) * 2.9, an = sw.ph - sw.dir * o, rad = S * 0.74 * (1 - 0.1 * o), fz = (0.03 + 0.07 * o) * R;
        x = Math.cos(an) * rad + m.ox * fz; y = Math.sin(an) * rad + m.oy * fz; env = 1 - 0.55 * m.u;
      } else {
        const f = figure(sw.iv, sw.ph + m.u * TAU, j); x = f[0] * S + m.ox * R * 0.07; y = f[1] * S + m.oy * R * 0.07; env = f[2];
      }
      x += (V.vnoise(m.seed, wt) - 0.5) * R * 0.32 * loose; y += (V.vnoise(m.seed + 50, wt) - 0.5) * R * 0.32 * loose;
      if (agit > 0.02) { const jt = t * 2.2; x += (V.vnoise(m.seed * 1.7, jt) - 0.5) * 9 * KS * agit; y += (V.vnoise(m.seed * 2.3, jt + 9) - 0.5) * 9 * KS * agit; x += misreg(sw, y, t); }
      m.env = Math.min(1, env * 1.6);
      m.px = m.x; m.py = m.y; m.x = sw.x + sw.jx + x; m.y = sw.y + sw.jy + y;
    });
    placeLanterns(sw, dt, t, sw.work, bl);
  }
  function placeLanterns(sw, dt, t, work, bl) {
    const R = sw.R;
    const lr = R * 1.45 + 10 * P.size * KS, lspin = -sw.dir * (0.25 + 0.3 * sw.cpu) * (0.4 + 0.6 * work) * (1 - 0.93 * vpnAmt);
    sw.lph += lspin * dt; const nl = Math.max(1, Math.round(sw.procs));
    sw.lan.forEach((L, j) => {
      L.th = sw.lph + j / nl * TAU;
      const rr = lr * (1 + 0.06 * Math.sin(L.wob + t * 0.9)) * (1 - 0.3 * vpnAmt) * (1 + 1.2 * bl);
      L.x = sw.x + sw.jx + Math.cos(L.th) * rr; L.y = sw.y + sw.jy + Math.sin(L.th) * rr * 0.8;
    });
  }

  // machine strain: the figure slips out of register in horizontal bands, as if noise were added to its geometry
  function misreg(sw, y, t) {
    if (agit < 0.02) return 0;
    const band = Math.floor((y + 400) / (7 * KS)), n = V.vnoise(band * 0.37 + sw.i * 11, t * 1.3);
    const on = clamp((n - 0.42) / 0.2, 0, 1);
    return (V.vnoise(band * 1.91 + 3, t * 0.9) - 0.5) * 2 * on * 15 * KS * Math.pow(agit, 1.1);
  }
  // network packets ride the swarm's own flight figure: download rim -> heart, upload heart -> rim
  const NET_IN = 0, NET_OUT = 1, PK_MAX = 90;
  const netLevel = m => clamp(Math.log10(1 + m * 1.5) / Math.log10(1 + 25 * 1.5), 0, 1);
  function jamBump(p) { const c = (p.dir === NET_IN ? 0.16 : 0.84) + p.jc; return Math.exp(-Math.pow((p.s - c) / 0.06, 2)); }
  function pkPos(sw, p, t) {
    const R = sw.R, e = p.s, rad = p.dir === NET_IN ? 1 - 0.92 * e : 0.08 + 0.92 * e;
    const along = (p.dir === NET_IN ? 1 : -1) * sw.dir * e * 1.1;

      const an = p.u + rad * 2.2 + sw.ph + along * 0.4, r = R * rad * (1 - 0.38 * vpnAmt);

      else { const f = figure(sw.iv, sw.ph + p.u * TAU + along, p.k); x = f[0] * Sc; y = f[1] * Sc; }

  }
  function stepNet(sw, d, S, dt, t, totW) {
    let rx = d.rx, tx = d.tx;
    if (rx === undefined) { const sh = (0.25 + sw.work) / totW; rx = S.net.mbps * sh * 0.75; tx = S.net.mbps * sh * 0.25; }
    sw.rx += (rx - sw.rx) * ease(dt, 0.4); sw.tx += (tx - sw.tx) * ease(dt, 0.4);

    [sw.rx, sw.tx].forEach((m, dir) => {
      sw.acc[dir] += 17 * netLevel(m) * live * dt;
      while (sw.acc[dir] >= 1) { sw.acc[dir] -= 1;
        if (sw.pk.length >= PK_MAX) continue;   // the link is full: nothing more gets in
        const k = Math.floor(V.rand() * 3);
        sw.pk.push({ dir, s: 0, ps: 0, u: sw.iv === 0 ? (V.rand() < 0.5 ? 0 : Math.PI) + (V.rand() - 0.5) * 0.5 : V.rand(),
          k, seed: V.rand() * 500, jc: (V.rand() - 0.5) * 0.12, lv: netLevel(m), jam: 0, die: V.rand() < lossP ? 0.25 + 0.5 * V.rand() : 9, age: 0, x: 0, y: 0, px: 0, py: 0 }); } });
    // jammed links stutter: the whole stream stops and goes
    const go = sw.jam > 0.02 ? lerp(1, V.vnoise(sw.i * 5.3, t * 2.4) > 0.55 ? 1 : 0.12, sw.jam) : 1;
    sw.pk.forEach(p => { p.age += dt; const b = jamBump(p);
      p.jam = sw.jam * b; const v = 0.72 * (1 - 0.975 * sw.jam * b) * go * (1 - 0.9 * vpnAmt);
      p.ps = p.s; p.s += v * dt;

  function step(V, S, dt) {
    const t = V.t, n = rankAll();
    // machine strain: continuous with level 0..3, plus thermal and memory pressure
    const sTarget = clamp(clamp((S.m.level - 0.4) / 2.6, 0, 1) * 0.82 + S.m.thermal * 0.06 + S.m.mempress * 0.03, 0, 1);

    // VPN
    const down = S.net.vpn === "down";

    prevVpn = S.net.vpn;
    vpnAmt += ((down ? 1 : 0) - vpnAmt) * ease(dt, down ? 0.5 : 0.35);
    beamPh += dt * TAU / 5.5; heartPh += dt / 1.7;
    // play
    const pr = S.play || { pair: ["", ""], amt: 0 };
