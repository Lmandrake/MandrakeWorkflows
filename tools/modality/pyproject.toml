[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modality"
version = "0.1.0"
description = "Estimate how multimodal a distribution is: local density maxima, reported separately from mixture-component count."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lukas Mandrake" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "diptest>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
modality = "modality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
