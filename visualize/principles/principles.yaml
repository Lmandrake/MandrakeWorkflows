# VizSkillLab principle registry
# ------------------------------------------------------------------------------
# Machine-readable synthesis of the acquired visualization literature (see
# ../sources/SOURCES.md and ../sources/source-notes/). Each principle traces to
# one or more real sources by ID. No source or DOI here is fabricated.
#
# Schema per principle:
#   id            : stable family-scoped identifier (e.g. ENC-01). Skills cite these.
#   class         : family (INTENT, SEM, ENC, PERC, HIER, LAYOUT, COLOR, ANNO,
#                   SCI, UNC, DIAG, NET, MAP, MEDIA, QA, ACCESS, CRIT)
#   principle     : one-sentence rule, imperative
#   force         : MUST | SHOULD | MAY | AVOID | ESCALATE
#                     MUST/AVOID   -> hard constraint (validity; never silently violate)
#                     SHOULD/MAY   -> soft/weighted preference (heuristic; trade off explicitly)
#                     ESCALATE     -> decision the agent must surface, not resolve silently
#   evidence_tier : A empirical/peer-reviewed · B mature institutional practice ·
#                   C canonical expert synthesis · D examples/inspiration
#   contexts      : where it applies (medium/data/task tags; "all" = general)
#   exceptions    : known contexts where it is relaxed or overridden
#   sources       : source IDs from SOURCES.md
#   rationale     : why it holds (mechanism, not restatement)
#   checks        : concrete, testable conditions an agent/QA step can evaluate
#
# The hard-vs-soft split itself is grounded in Draco (S10): hard constraints
# gate validity; soft constraints are weighted preferences resolved by cost.
# ------------------------------------------------------------------------------

meta:
  version: "0.1"
  generated: "2026-08-28"
  force_semantics:
    MUST: hard constraint; violation makes the artifact invalid
    AVOID: hard negative constraint; the named construction is invalid unless an exception fires
    SHOULD: strong weighted preference; deviate only for a stated reason
    MAY: optional/permitted technique
    ESCALATE: a judgment the agent must raise to the user or resolve against stated intent, never silently
  families:
    INTENT: communication intent, audience, task framing
    SEM: semantic mapping of data relationship to chart family
    ENC: visual-channel encoding choices
    PERC: perceptual effectiveness / clutter
    HIER: attention and visual hierarchy
    LAYOUT: composition and layout
    COLOR: color scales and palettes
    ANNO: annotation, labeling, captioning, sourcing
    SCI: scientific / quantitative integrity
    UNC: uncertainty and honesty of transformation
    DIAG: technical-diagram grammar
    NET: network figures
    MAP: cartography
    MEDIA: medium fitness and export
    QA: validity gating and rendering inspection
    ACCESS: accessibility (color, contrast, redundancy)
    CRIT: design process, justification, critique
    MOTION: animation, builds and transitions (ids motion.NN; candidates, untested; see presentation/EXTRACTION.md)

principles:

  # ---- INTENT --------------------------------------------------------------
  - id: INTENT-01
    class: INTENT
    principle: Characterize the domain problem, users, data, and task abstraction before choosing any visual encoding.
    force: MUST
    evidence_tier: A
    contexts: [all]
    exceptions: []
    sources: [S01]
    rationale: >
      Munzner's nested model shows most failures originate upstream of the
      encoding: solving the wrong problem or abstracting the data wrongly cannot
      be rescued by a good chart. Getting the level right prevents wasted work.
    checks:
      - A stated user/domain problem exists before an encoding is proposed.
      - Data is described as abstract types (quantitative/ordinal/categorical/relational/spatial/temporal).

  - id: INTENT-02
    class: INTENT
    principle: Express the user's goal as generic operations over abstract data types before selecting an encoding.
    force: MUST
    evidence_tier: A
    contexts: [all]
    exceptions: []
    sources: [S01]
    rationale: >
      Naming the abstract task (compare, rank, correlate, locate, trend, part-to-whole)
      makes the correct encoding derivable rather than guessed.
    checks:
      - The intended reader operation is named explicitly.

  - id: INTENT-03
    class: INTENT
    principle: Identify the audience's graphical literacy, numeracy, and domain knowledge and tailor the design to them.
    force: MUST
    evidence_tier: A
    contexts: [all]
    exceptions: []
    sources: [S02, S03, S14]
    rationale: >
      Franconeri et al. show comprehension depends on the viewer; the same chart
      that informs an expert can mislead a lay audience. Intent is audience-relative.
    checks:
      - Audience is named; chart complexity and framing match their literacy.

  - id: INTENT-04
    class: INTENT
    principle: Fix the single intended message or takeaway before designing; where a figure has a caption, draft it first.
    force: MUST
    evidence_tier: A
    contexts: [all]
    exceptions: [exploratory_dashboard]
    sources: [S03, S09]
    rationale: >
      A figure with no decided message optimizes nothing. Writing the caption
      first forces the message to exist and reveals what must be salient.
    checks:
      - A one-sentence takeaway is recorded before layout begins.

  # ---- SEM -----------------------------------------------------------------
  - id: SEM-01
    class: SEM
    principle: Choose the chart family from the analytic relationship to emphasize, not from aesthetics or habit.
    force: SHOULD
    evidence_tier: B
    contexts: [all]
    exceptions: []
    sources: [S04, C1]
    rationale: >
      The FT Visual Vocabulary organizes charts by intent (deviation, correlation,
      ranking, distribution, change-over-time, part-to-whole, magnitude, spatial,
      flow). Selecting by relationship yields the readable chart for the question.
    checks:
      - The chosen chart family matches the named analytic relationship.

  - id: SEM-02
    class: SEM
    principle: Treat chart recommendation as completing a partial specification given the data schema and task, not inventing from a blank slate.
    force: SHOULD
    evidence_tier: A
    contexts: [all]
    exceptions: []
    sources: [S10]
    rationale: >
      Draco formalizes design as constraint completion over a schema+task; this
      keeps choices derivable and checkable rather than arbitrary.
    checks:
      - Data fields and task are declared before marks/channels are fixed.

  - id: SEM-03
    class: SEM
    principle: Respect conventional associations (up = more, darker = more, familiar chart types) unless there is a reason to break them.
    force: SHOULD
    evidence_tier: A
    contexts: [all]
    exceptions: [convention_conflicts_with_data_meaning]
    sources: [S02]
    rationale: >
      Violating strong conventions forces re-learning and invites misreading;
      conventional mappings are read faster and more accurately.
    checks:
      - Directional/tonal conventions are honored or an explicit reason is noted.

  - id: SEM-04
    class: SEM
    principle: Match marks and channels to data semantics — use arrows only for asymmetric/directional relations, identity channels for categories, magnitude channels for quantities.
    force: SHOULD
    evidence_tier: B
    contexts: [networks, diagrams, encoding]
    exceptions: []
    sources: [S09]
    rationale: >
      A directed arrow asserts asymmetry; a hue asserts a category. Mismatched
      marks make false claims about the data.
    checks:
      - Every mark/channel corresponds to a real property of the data it encodes.

  - id: SEM-05
    class: SEM
    principle: Reserve maps for when precise location or geographic pattern is the point; otherwise use a non-spatial chart.
    force: SHOULD
    evidence_tier: B
    contexts: [geospatial]
    exceptions: [audience_expects_map_for_orientation]
    sources: [S04]
    rationale: >
      A map spends the strongest spatial channel on geography; if geography is not
      the message, a bar/line chart reads the quantity more accurately.
    checks:
      - Geography is load-bearing for the message when a map is used.

  # ---- ENC -----------------------------------------------------------------
  - id: ENC-01
    class: ENC
    principle: Encode the most accuracy-critical values on the highest-precision channel, following position > length > angle/slope > area > color-intensity.
    force: SHOULD
    evidence_tier: A
    contexts: [all]
    exceptions: [magnitude_reading_not_required]
    sources: [S02, S15]
    rationale: >
      Graphical-perception experiments (Cleveland & McGill, replicated by Heer &
      Bostock) rank channels by decoding accuracy; putting the key comparison on a
      weaker channel costs precision. (Ranking of area vs angle is order-adjacent
      across sources; both sit below position/length.)
    checks:
      - The most decision-critical quantity is on position or length where feasible.

  - id: ENC-02
    class: ENC
    principle: Anchor bar and column value axes at zero.
    force: MUST
    evidence_tier: B
    contexts: [bar_chart, column_chart]
    exceptions: []
    sources: [S04]
    rationale: >
      A bar's length encodes magnitude; truncating its baseline makes length lie
      about ratio. For non-length encodings the baseline is a soft choice (see UNC-01).
    checks:
      - Any bar/column magnitude axis includes zero.

  - id: ENC-03
    class: ENC
    principle: Avoid area- and luminance/intensity-based encodings when the reader must extract precise magnitudes.
    force: AVOID
    evidence_tier: A
    contexts: [precise_comparison]
    exceptions: [overview_or_gestalt_only]
    sources: [S15]
    rationale: >
      Area and intensity are low-accuracy channels; readers systematically
      underestimate area ratios.
    checks:
      - Precise comparisons do not rely on bubble area or color intensity alone.

  - id: ENC-04
    class: ENC
    principle: Avoid pie and donut (angle/area) encodings when comparing more than a few magnitudes.
    force: AVOID
    evidence_tier: A
    contexts: [part_to_whole, comparison]
    exceptions: [two_or_three_slices_rough_share]
    sources: [S15, S04]
    rationale: >
      Angle and slice area are hard to compare; a ranked bar reads the same data
      more accurately.
    checks:
      - No pie/donut is used to compare many categories precisely.

  - id: ENC-05
    class: ENC
    principle: Align items on a common baseline or scale to enable the most accurate comparison.
    force: SHOULD
    evidence_tier: A
    contexts: [comparison]
    exceptions: []
    sources: [S15]
    rationale: >
      Position-along-a-common-scale is the highest-accuracy judgment; shared
      baselines convert vague comparisons into precise ones.
    checks:
      - Compared series share an axis/baseline where possible.

  - id: ENC-06
    class: ENC
    principle: On thematic maps, encode rates or ratios with choropleth shading and totals or counts with proportional symbols.
    force: SHOULD
    evidence_tier: B
    contexts: [geospatial, thematic_map]
    exceptions: []
    sources: [S04]
    rationale: >
      Choropleth area implies density/normalization; mapping raw counts to area
      confounds magnitude with region size.
    checks:
      - Counts use proportional symbols; normalized rates use choropleth.

  - id: ENC-07
    class: ENC
    principle: Use pictograms/isotypes only for whole-number counts and never slice a single icon to show a fraction.
    force: AVOID
    evidence_tier: B
    contexts: [infographic]
    exceptions: []
    sources: [S04]
    rationale: >
      A partial icon reads ambiguously; isotypes communicate by countable units.
    checks:
      - Pictogram units are whole and countable.

  - id: ENC-08
    class: ENC
    principle: Use the simplest plot type that conveys the message.
    force: SHOULD
    evidence_tier: B
    contexts: [all]
    exceptions: []
    sources: [S03]
    rationale: >
      Added encoding complexity costs decoding effort; simplicity that still
      carries the message maximizes comprehension per unit attention.
    checks:
      - No encoding dimension is present that the message does not need.

  - id: ENC-09
    class: ENC
    principle: Do not accept the tool's plotting defaults; deliberately set size, fonts, colors, ticks, and markers.
    force: SHOULD
    evidence_tier: B
    contexts: [all]
    exceptions: []
    sources: [S03, C1]
    rationale: >
      Library defaults are tuned for generality, not for this message or medium;
      unexamined defaults are a common source of clutter and illegibility.
    checks:
      - Key style parameters are explicitly chosen, not left at defaults.

  - id: ENC-10
    class: ENC
    principle: Avoid 3-D depictions of data unless the task inherently requires understanding 3-D shape or space.
    force: AVOID
    evidence_tier: B
    contexts: [static_figure]
    exceptions: [inherently_spatial_phenomena, animated_scientific_visualization]
    sources: [S09]
    rationale: >
      Perspective distorts position/length and occludes marks. NASA SVS-style
      spatial science viz (S12) is the justified exception when 3-D is the subject.
    checks:
      - 3-D is used only where the phenomenon itself is 3-D/spatial.

  # ---- PERC ----------------------------------------------------------------
  - id: PERC-01
    class: PERC
    principle: Control gridline and label density; keep gridlines subtle and do not overfill the frame.
    force: SHOULD
    evidence_tier: B
    contexts: [all]
    exceptions: []
    sources: [S07, C1]
    rationale: >
      High-salience gridlines compete with data for attention; subtle reference
      lines support reading without dominating it.
    checks:
      - Gridlines are lower-contrast than data marks.

  - id: PERC-02
    class: PERC
    principle: Avoid plot constructions that alter local color perception, such as adjacent touching heatmap tiles.
    force: SHOULD
    evidence_tier: A
    contexts: [heatmap, color_encoding]
    exceptions: []
    sources: [S05]
    rationale: >
      Simultaneous contrast shifts perceived color at boundaries; small gaps or
      borders preserve the intended value.
    checks:
      - Contiguous color cells are separated or bordered where value reading matters.

  # ---- HIER ----------------------------------------------------------------
  - id: HIER-01
    class: HIER
    principle: Build an explicit visual hierarchy so the most important content sits on the highest visual plane and reference content recedes.
    force: MUST
    evidence_tier: A
    contexts: [all]
    exceptions: []
    sources: [S11, S09]
    rationale: >
      Attention is finite and ordered; without an engineered hierarchy the eye
      lands arbitrarily and the message is not guaranteed to be seen first.
    checks:
      - The intended first-read element is the most visually salient.
    validation: >
      owner gallery (n=1, Visitors 2026-10-31): bandwidth, which he cares about, was 'too subtle' on all 5 concepts, the only row with no thumbs-up. Supports this entry, not a test of it.

  - id: HIER-02
    class: HIER
    principle: Use visual grouping cues (proximity, enclosure, shared color) to set up the intended comparison.
    force: SHOULD
    evidence_tier: A
    contexts: [all]
    exceptions: []
    sources: [S02]
    rationale: >
      Grouping steers which elements the viewer compares; the right grouping makes
      the intended comparison effortless.
    checks:
      - Elements meant to be compared are perceptually grouped.

  - id: HIER-03
    class: HIER
    principle: Start neutral (grays) and add color or emphasis only to the elements that carry the message.
    force: SHOULD
    evidence_tier: B
    contexts: [all]
    exceptions: []
    sources: [S02, S07]
    rationale: >
      Emphasis is relative; if everything is emphasized, nothing is. A neutral
      base makes selective highlighting readable.
    checks:
      - Non-focal data is de-emphasized relative to the highlighted element.

  - id: HIER-04
    class: HIER
    principle: Use layering and separation (weight, luminance, opacity, size) to raise key information above clutter.
    force: SHOULD
    evidence_tier: B
    contexts: [dense_figures, networks, maps]
    exceptions: []
    sources: [S09, S11]
    rationale: >
      In dense figures, foreground/background separation is the main lever for
      readability when elements cannot simply be removed.
    checks:
      - Key marks are separable from background layers at a glance.

  # ---- LAYOUT --------------------------------------------------------------
  - id: LAYOUT-01
    class: LAYOUT
    principle: Remove non-informative ink and decoration unless it carries information.
    force: SHOULD
    evidence_tier: B
    contexts: [all]
    exceptions: [scaffolding_aids_novice_comprehension]
    sources: [S03, S06]
    rationale: >
      Decoration competes with data for attention and bandwidth. The limit is
      scaffolding that genuinely aids comprehension (see conflicts.md).
    checks:
      - Every non-data element has a stated reader-serving purpose.

  - id: LAYOUT-02
    class: LAYOUT
    principle: Reduce clutter and prefer small multiples or multi-panel layouts over one overloaded chart.
    force: SHOULD
    evidence_tier: B
    contexts: [all]
    exceptions: []
    sources: [S02, S03]
    rationale: >
      Splitting an overloaded chart into aligned small multiples lets each panel
      answer one question and supports fast cross-panel comparison.
    checks:
      - No single panel is asked to carry more comparisons than it can show clearly.

  - id: LAYOUT-03
    class: LAYOUT
    principle: Establish figure-ground so the subject reads clearly as foreground against a receding background.
    force: SHOULD
    evidence_tier: A
    contexts: [maps, posters, slides]
    exceptions: []
    sources: [S11]
    rationale: >
      Without figure-ground the viewer cannot tell subject from context, and the
      composition reads as flat noise.
    checks:
      - The subject is distinguishable from context via contrast/enclosure/depth cues.

  - id: LAYOUT-04
    class: LAYOUT
    principle: Arrange multi-panel figures neatly and aligned, sizing panels by content and legibility.
    force: SHOULD
    evidence_tier: B
    contexts: [multi_panel, publication]
    exceptions: []
    sources: [S06, S11]
    rationale: >
      Alignment creates a reading order and reduces cognitive load; ad-hoc panel
      sizing implies false importance differences.
    checks:
      - Panels align to a grid; sizes reflect content needs, not accident.

  - id: LAYOUT-05
    class: LAYOUT
    principle: Balance the composition around the visual center and create harmony through alignment and even distribution.
    force: SHOULD
    evidence_tier: B
    contexts: [slides, posters, layouts]
    exceptions: []
    sources: [S11]
    rationale: >
      Perceived balance (slightly above geometric center) reads as intentional and
      stable; unbalanced layouts distract from content.
    checks:
      - Visual weight is distributed intentionally, not lumped to one side by accident.

  # ---- COLOR ---------------------------------------------------------------
  - id: COLOR-01
    class: COLOR
    principle: Encode quantitative data with a perceptually uniform color map so equal data steps read as equal perceptual steps.
    force: MUST
    evidence_tier: A
    contexts: [continuous_color, scientific_figure]
    exceptions: []
    sources: [S05]
    rationale: >
      Non-uniform maps create false gradients and hide real ones; perceptual
      uniformity keeps the color-to-value relationship honest.
    checks:
      - The continuous color map is a documented perceptually uniform map.

  - id: COLOR-02
    class: COLOR
    applies_in_modes: {grayscale_survival: [print_grayscale]}   # ordering half stays default; see principles/modes.md
    principle: Use color maps with monotonic lightness so values rank correctly without the color bar and survive grayscale printing.
    force: MUST
    evidence_tier: A
    contexts: [continuous_color]
    exceptions: [diverging_maps_with_light_center_by_design]
    sources: [S05, S09]
    rationale: >
      Ordering carried by lightness is robust to color-vision deficiency and
      grayscale reproduction; hue-only ordering is not.
    checks:
      - Converting the figure to grayscale preserves the value ordering.

  - id: COLOR-03
    class: COLOR
    principle: Do not use rainbow / jet color maps for data.
    force: AVOID
    evidence_tier: A
    contexts: [continuous_color]
    exceptions: []
    sources: [S05]
    rationale: >
      Rainbow maps are perceptually non-uniform, create artificial boundaries, and
      fail for color-blind readers and in grayscale. (S03 states the weaker "avoid
      unless justified"; S05 is the stronger authority — see conflicts.md.)
    checks:
      - No jet/rainbow map is used for a data dimension.

  - id: COLOR-04
    class: COLOR
    principle: Match the color-map class to the data — sequential for ordered magnitude, diverging for data around a meaningful midpoint, categorical for nominal groups.
    force: MUST
    evidence_tier: A
    contexts: [color_encoding]
    exceptions: []
    sources: [S05, S07, S03]
    rationale: >
      A diverging map on non-centered data invents a false midpoint; a categorical
      palette on ordered data destroys ordering.
    checks:
      - Palette class matches the data's structure (ordered/centered/nominal).

  - id: COLOR-05
    class: COLOR
    principle: Do not deform, truncate, stretch, or resample a scientific color map's segments.
    force: AVOID
    evidence_tier: A
    contexts: [continuous_color]
    exceptions: []
    sources: [S05]
    rationale: >
      Editing a validated map's spacing reintroduces the perceptual non-uniformity
      the map was designed to remove.
    checks:
      - The color map is used at its designed range and spacing.

  - id: COLOR-06
    class: COLOR
    principle: Give every color a reason; default to black/gray and add color only to carry information or to highlight.
    force: SHOULD
    evidence_tier: B
    contexts: [all]
    exceptions: []
    sources: [S03, S07]
    rationale: >
      Unmotivated color implies categories that do not exist and dilutes the color
      that does mean something.
    checks:
      - Each distinct color maps to a distinct, intended meaning.

  # ---- ANNO ----------------------------------------------------------------
  - id: ANNO-01
    class: ANNO
    principle: Prefer direct labels on the marks over a detached legend wherever placement allows.
    force: SHOULD
    evidence_tier: A
    contexts: [all]
    exceptions: [too_many_series_for_direct_labels]
    sources: [S02, S07, S13]
    rationale: >
      A detached legend forces a look-up round trip and a working-memory match;
      direct labels remove that cost and reduce misattribution.
    checks:
      - Series are labeled in place unless density makes it infeasible.

  - id: ANNO-02
    class: ANNO
    principle: Write the title to state the single key insight, not merely to name the dataset.
    force: SHOULD
    evidence_tier: B
    contexts: [communication_graphics]
    exceptions: [neutral_reference_figures]
    sources: [S07, S13]
    rationale: >
      An insight-bearing title tells the reader what to conclude and primes the
      correct reading of the chart.
    checks:
      - The title asserts a takeaway, not just variables.

  - id: ANNO-03
    class: ANNO
    principle: Provide a caption or description that explains how to read the figure and supplies information the graphic cannot.
    force: MUST
    evidence_tier: B
    contexts: [publication, standalone_figures]
    exceptions: []
    sources: [S03, S13]
    rationale: >
      Figures are reused out of context; a self-contained caption (what/when/where/
      sample size) prevents misreading when the surrounding text is gone.
    checks:
      - The figure plus caption is interpretable on its own.

  - id: ANNO-04
    class: ANNO
    principle: Always include the color bar wherever a color scale encodes values.
    force: MUST
    evidence_tier: A
    contexts: [continuous_color]
    exceptions: []
    sources: [S05]
    rationale: >
      Without the color bar the mapping from color to value is unknowable and the
      figure is unquantifiable.
    checks:
      - A labeled color bar accompanies every data color scale.

  - id: ANNO-05
    class: ANNO
    principle: Include axis lines, tick marks, and axis labels with units.
    force: MUST
    evidence_tier: B
    contexts: [charts, scientific_figures]
    exceptions: []
    sources: [S06]
    rationale: >
      Unlabeled axes and missing units make values unreadable and invite unit errors.
    checks:
      - Every quantitative axis has ticks and a unit-bearing label.

  - id: ANNO-06
    class: ANNO
    principle: Cite the data source by name (and link where possible).
    force: MUST
    evidence_tier: B
    contexts: [published, shared]
    exceptions: []
    sources: [S13]
    rationale: >
      Attribution supports verification and trust and is an integrity requirement
      for shared graphics.
    checks:
      - A data source is stated on or beside the figure.

  - id: ANNO-07
    class: ANNO
    principle: Disclose caveats, exclusions, and abnormalities in a notes line.
    force: SHOULD
    evidence_tier: B
    contexts: [published, shared]
    exceptions: []
    sources: [S13]
    rationale: >
      Silent exclusions mislead; a notes line preserves honesty without cluttering
      the plot area.
    checks:
      - Known data caveats appear in notes when present.

  - id: ANNO-08
    class: ANNO
    principle: When a chart shows correlation, annotate or caption it to forestall unwarranted causal inference.
    force: SHOULD
    evidence_tier: B
    contexts: [correlation_charts]
    exceptions: []
    sources: [S04]
    rationale: >
      Readers over-read causation from adjacency and trend lines; explicit framing
      prevents the misread.
    checks:
      - Correlation figures avoid causal phrasing and note the limitation if needed.

  - id: ANNO-09
    class: ANNO
    principle: Provide screen-reader alternative text that conveys the figure's main statements.
    force: SHOULD
    evidence_tier: B
    contexts: [digital, web, accessibility]
    exceptions: []
    sources: [S13]
    rationale: >
      Alt text is the only channel for non-sighted readers; it should carry the
      conclusion, not just "chart".
    checks:
      - Alt text states the takeaway and key values.

  - id: ANNO-10
    class: ANNO
    principle: Make labels legible (at least caption size, horizontal, high contrast) and ensure figure and caption each stand alone.
    force: MUST
    evidence_tier: A
    contexts: [publication, networks]
    exceptions: []
    sources: [S09]
    rationale: >
      Rotated, tiny, or low-contrast labels are effectively absent; independence of
      figure and caption is required for reuse and review.
    checks:
      - All labels are readable at final size; unusual markers are defined.

  - id: ANNO-11
    class: ANNO
    principle: Include a legend documenting every color, line style, shape, and badge convention used in a diagram.
    force: MUST
    evidence_tier: A
    contexts: [technical_diagrams, networks]
    exceptions: [single_obvious_encoding]
    sources: [S08]
    rationale: >
      Diagram vocabularies are not self-evident; an undocumented convention is a
      guess for the reader.
    checks:
      - Each visual convention with meaning appears in a legend.

  # ---- SCI -----------------------------------------------------------------
  - id: SCI-01
    class: SCI
    principle: Plot the raw distribution (histogram, scatter, jittered points) before trusting or presenting summary statistics.
    force: SHOULD
    evidence_tier: A
    contexts: [scientific, quantitative]
    exceptions: []
    sources: [S02]
    rationale: >
      Summaries hide multimodality, outliers, and unequal variance; the raw shape
      can overturn the summary's implied story.
    checks:
      - The distribution was inspected; bar-of-means over raw spread is justified.

  - id: SCI-02
    class: SCI
    principle: Do not mislead — show the true value range, encode magnitude on the perceived channel (area by area, not radius), and avoid 3-D for quantity comparison.
    force: MUST
    evidence_tier: B
    contexts: [quantitative]
    exceptions: []
    sources: [S03]
    rationale: >
      Radius-scaled "area", hidden truncation, and 3-D perspective all distort the
      encoded quantity and misinform the reader.
    checks:
      - Encoded magnitude equals intended magnitude under measurement.

  - id: SCI-03
    class: SCI
    principle: Preserve scientific fidelity — base every visual on real data or models and treat the visualization as an instrument of inquiry, not decoration.
    force: MUST
    evidence_tier: A
    contexts: [scientific_visualization]
    exceptions: []
    sources: [S12]
    rationale: >
      NASA SVS practice ties visual choices to underlying physical data; decorative
      liberties that break correspondence forfeit scientific validity.
    checks:
      - Every visible feature corresponds to a data/model quantity.

  - id: SCI-04
    class: SCI
    principle: Use labeled scale bars (not magnification factors), keep them on a separate editable layer, and comply with image-integrity policy.
    force: MUST
    evidence_tier: B
    contexts: [microscopy, imaging, publication]
    exceptions: []
    sources: [S06]
    rationale: >
      Magnification factors break when images are resized; scale bars travel with
      the image. Integrity policy forbids undisclosed manipulation.
    checks:
      - A scale bar with units is present; no undisclosed image edits.

  - id: SCI-05
    class: SCI
    principle: Make invisible phenomena perceptible by mapping non-visible properties to visible channels, while keeping the mapping honest.
    force: SHOULD
    evidence_tier: B
    contexts: [scientific_visualization, remote_sensing]
    exceptions: []
    sources: [S12]
    rationale: >
      Much science is non-optical; rendering it visible is the point, provided the
      chosen mapping is disclosed and does not fabricate structure.
    checks:
      - Non-visible-to-visible mappings are stated and defensible.

  - id: SCI-06
    class: SCI
    principle: Every stated numeric or comparative claim (title, annotation, takeaway) must be verifiable from the encoded quantities and the stated reference frame — the claim's baseline, units, and scope must be the same ones the marks actually encode.
    force: MUST
    evidence_tier: A
    contexts: [all, quantitative, scientific_visualization]
    exceptions: []
    sources: [S02, S03]
    rationale: >
      Titles and annotations steer interpretation more strongly than the marks
      (S02); a headline can assert a comparison in a different reference frame than
      the encoding supports — e.g. "warming since the late 1800s" printed over an
      axis of anomalies vs a 1951–1980 baseline — and still pass every perceptual
      gate. When the claim's baseline/units/scope differ from what is plotted, the
      figure misinforms even though no mark is drawn dishonestly. The remedy is
      either to compute the claim in the encoded frame or to make the claim's frame
      visible on the same axis (a reference line/label the reader can read against).
    checks:
      - Each numeric/comparative claim names a baseline/units/scope that matches the encoded quantity, OR that reference frame is shown on the figure.
      - No headline number is silently borrowed from a different baseline than the axis.

  - id: SCI-07
    class: SCI
    principle: Do not let aggregation misrepresent subgroups — verify that any variable used to decompose or explain the data actually varies across the units shown, and never present a pooled summary or pooled fit (a combined mean, trend, or regression line) as if it described each subgroup.
    force: MUST
    evidence_tier: B
    contexts: [all, quantitative, scientific_visualization]
    exceptions: []
    sources: [S02, S03]
    rationale: >
      A statistic computed on pooled data can weaken, erase, or reverse the pattern
      that holds within each group (Simpson's paradox / the ecological fallacy): a
      single regression line drawn over combined groups, or a group mean over a
      variable that does not actually vary, asserts a per-group story the data do
      not support. Summaries hide subgroup structure (S02) and honest figures avoid
      misleading the reader (S03); the remedy is to show the disaggregated view —
      small multiples, per-group fits, or the raw grouped points — or to state
      plainly that the summary is pooled and not per-group. Elevated from reviewer
      intuition to an explicit principle by the 2026-09-01 36-case bake-off, where
      "pooled fit passed off as a group description" was the highest-value,
      least-obvious catch (cases 05 and 33). The named paradox is standard
      statistics, not a claim attributed to S02/S03.
    checks:
      - Any decomposition or explanatory variable demonstrably varies across the units displayed.
      - No pooled mean or pooled regression is labeled/captioned as a per-subgroup result; if pooled, it is disclosed as pooled or the disaggregated view is shown alongside.

  # ---- UNC -----------------------------------------------------------------
  - id: UNC-01
    class: UNC
    principle: Treat the non-bar y-axis zero-baseline choice as a decision to surface — whether the message is a ratio (needs zero) or a difference (may crop) — rather than a silent default.
    force: ESCALATE
    evidence_tier: A
    contexts: [line_chart, quantitative]
    exceptions: []
    sources: [S02, S10]
    rationale: >
      Truncation can both hide real change and manufacture false change; the
      correct baseline depends on whether ratio or difference is meant. Draco
      models this as a weighted, not absolute, constraint (see CRIT-04). Bars are
      the hard-constraint exception (ENC-02).
    checks:
      - Baseline choice is justified by ratio-vs-difference intent and disclosed.

  - id: UNC-02
    class: UNC
    principle: For lay audiences, convey confidence with discrete outcome examples rather than abstract error bars, and express risk as absolute natural frequencies ("3 out of 10") not relative percentages.
    force: SHOULD
    evidence_tier: A
    contexts: [risk_communication, lay_audience]
    exceptions: [expert_audience_expects_intervals]
    sources: [S02]
    rationale: >
      Error bars are widely misread by non-experts; frequency framings and outcome
      arrays are decoded more accurately and less manipulably.
    checks:
      - Uncertainty framing matches audience numeracy.

  - id: UNC-03
    class: UNC
    principle: Disclose any departure from literal fidelity — vertical exaggeration, non-scale sizing, simulated or imagined content.
    force: MUST
    evidence_tier: A
    contexts: [scientific_visualization, outreach]
    exceptions: []
    sources: [S12]
    rationale: >
      Undisclosed exaggeration or simulation is indistinguishable from data to the
      viewer and constitutes misinformation.
    checks:
      - Any non-literal transformation is labeled.

  # ---- DIAG ----------------------------------------------------------------
  - id: DIAG-01
    class: DIAG
    principle: Define the node and connector visual vocabulary (types, shapes, line and ending styles, colors) before drawing, and publish it in a legend.
    force: MUST
    evidence_tier: A
    contexts: [technical_diagrams]
    exceptions: []
    sources: [S08]
    rationale: >
      A diagram is a small visual language; an undeclared grammar produces
      inconsistent, unreadable diagrams.
    checks:
      - A declared vocabulary exists and the diagram conforms to it.

  - id: DIAG-02
    class: DIAG
    principle: Introduce a distinct node or connector type only when the semantics differ; avoid redundant shape/style/color/badge encodings.
    force: SHOULD
    evidence_tier: B
    contexts: [technical_diagrams]
    exceptions: []
    sources: [S08]
    rationale: >
      Every distinct visual form implies a distinct meaning; needless variety
      makes readers hunt for differences that do not exist.
    checks:
      - Distinct visual forms correspond to distinct meanings.

  - id: DIAG-03
    class: DIAG
    principle: Route connectors cleanly (orthogonal by default), minimize crossings, keep connectors off text, and make endpoints unambiguous.
    force: SHOULD
    evidence_tier: B
    contexts: [technical_diagrams, flows]
    exceptions: []
    sources: [S08]
    rationale: >
      Crossings and ambiguous endpoints create false or unreadable relationships;
      clean routing preserves the intended topology.
    checks:
      - Each connector's two endpoints are unambiguous; crossings are minimized.

  - id: DIAG-04
    class: DIAG
    principle: When a standardized domain vocabulary exists, follow it rather than inventing one.
    force: SHOULD
    evidence_tier: B
    contexts: [technical_diagrams]
    exceptions: []
    sources: [S08]
    rationale: >
      Standard notations are pre-learned by the audience; a private notation forces
      re-learning and invites misreading.
    checks:
      - Established domain notation is used where applicable.

  - id: DIAG-05
    class: DIAG
    principle: Explain nonstandard syntax and prevent accidental meaning from incidental proximity, size, or color.
    force: SHOULD
    evidence_tier: B
    contexts: [technical_diagrams]
    exceptions: []
    sources: [S08]
    rationale: >
      Viewers read meaning into every visual relationship; unexplained or
      accidental cues assert claims the author did not intend.
    checks:
      - Incidental visual relationships do not imply unintended meaning.

  # ---- NET -----------------------------------------------------------------
  - id: NET-01
    class: NET
    principle: Define the network figure's purpose before choosing a layout.
    force: MUST
    evidence_tier: A
    contexts: [networks]
    exceptions: []
    sources: [S09]
    rationale: >
      Different questions (paths, clusters, hubs, flow) demand different layouts;
      layout-first produces a hairball that answers nothing.
    checks:
      - The network task is stated before the layout is selected.

  - id: NET-02
    class: NET
    principle: Do not default to node-link; use adjacency matrices for dense networks and implicit layouts for hierarchies.
    force: SHOULD
    evidence_tier: B
    contexts: [networks, dense_graphs]
    exceptions: []
    sources: [S09]
    rationale: >
      Node-link diagrams become unreadable hairballs past moderate density; matrices
      scale where node-link fails.
    checks:
      - Representation matches density; dense graphs are not forced into node-link.

  - id: NET-03
    class: NET
    principle: Treat spatial position in a network as meaningful — proximity reads as relatedness, centrality as importance, direction as flow.
    force: MUST
    evidence_tier: A
    contexts: [networks]
    exceptions: []
    sources: [S09]
    rationale: >
      Readers infer meaning from position whether or not it was intended; layouts
      must make position reflect real structure.
    checks:
      - Positional cues correspond to real topological properties.

  - id: NET-04
    class: NET
    principle: Reduce to the appropriate level of detail through aggregation or clustering.
    force: SHOULD
    evidence_tier: B
    contexts: [networks, large_graphs]
    exceptions: []
    sources: [S09]
    rationale: >
      Showing every node when the message is at the cluster level buries the
      finding; aggregation matches detail to the question.
    checks:
      - Detail level matches the stated network task.

  # ---- MAP -----------------------------------------------------------------
  - id: MAP-01
    class: MAP
    principle: Ensure legibility — map content must be both seen and understood; size symbols and text for the map's complexity and prefer familiar, self-evident symbols.
    force: MUST
    evidence_tier: A
    contexts: [cartography]
    exceptions: []
    sources: [S11]
    rationale: >
      A map the reader cannot parse conveys nothing; legibility is the precondition
      for every other cartographic goal.
    checks:
      - Symbols and labels are readable at the intended map scale.

  - id: MAP-02
    class: MAP
    principle: Give basemap and context layers deliberately low contrast so thematic layers stay prominent.
    force: SHOULD
    evidence_tier: B
    contexts: [thematic_maps]
    exceptions: []
    sources: [S11]
    rationale: >
      A loud basemap competes with the theme; muting context enforces the intended
      figure-ground.
    checks:
      - Thematic data outranks basemap in visual salience.

  # ---- MEDIA ---------------------------------------------------------------
  - id: MEDIA-01
    class: MEDIA
    principle: Produce a medium-specific version — thicker lines, larger text, stronger contrast, less detail for talks and projection — rather than reusing a publication figure unchanged.
    force: SHOULD
    evidence_tier: B
    contexts: [presentation, projection]
    exceptions: []
    sources: [S03]
    rationale: >
      A figure legible in print at reading distance is often unreadable projected;
      the medium sets different legibility floors.
    checks:
      - The artifact is legible under its actual medium and viewing distance.

  - id: MEDIA-02
    class: MEDIA
    principle: Design at the final output size and keep fonts within the medium's legible range.
    force: MUST
    evidence_tier: B
    contexts: [all]
    exceptions: []
    sources: [S06]
    rationale: >
      Elements chosen at the wrong scale become illegible or dominant after
      resizing; designing at final size prevents surprise.
    checks:
      - The figure is evaluated at the exact final dimensions.

  - id: MEDIA-03
    class: MEDIA
    principle: Export vector with editable embedded-font text where possible; when raster is required use at least 300 dpi and never upsample.
    force: MUST
    evidence_tier: B
    contexts: [publication, print]
    exceptions: [inherently_raster_imagery]
    sources: [S06]
    rationale: >
      Vector text stays crisp and editable at any size; upsampled raster is
      irreversibly blurry.
    checks:
      - Output format matches content; no upscaling of raster art.

  - id: MEDIA-04
    class: MEDIA
    principle: For interactive views, surface the crucial points up front and follow overview then zoom/filter then details-on-demand; never hide essential information behind interaction.
    force: SHOULD
    evidence_tier: B
    contexts: [dashboard, interactive]
    exceptions: []
    sources: [S07]
    rationale: >
      Information reachable only by interaction is invisible to a viewer who does
      not act; the key message must be visible without input.
    checks:
      - The core message is visible before any interaction.

  - id: MEDIA-05
    class: MEDIA
    principle: If more than about three non-redundant visual properties are needed to map the data, split into multiple focused figures.
    force: SHOULD
    evidence_tier: C
    contexts: [information_dense]
    exceptions: []
    sources: [S09]
    rationale: >
      Beyond a few simultaneous encodings, decoding load overwhelms comprehension;
      splitting preserves clarity.
    checks:
      - No single figure overloads the viewer with too many encodings.

  # ---- QA ------------------------------------------------------------------
  - id: QA-01
    class: QA
    principle: Separate design knowledge into hard constraints that gate validity and soft weighted preferences that are traded off, and treat the two differently.
    force: MUST
    evidence_tier: A
    contexts: [all]
    exceptions: []
    sources: [S10]
    rationale: >
      Draco's central result: conflating "invalid" with "dispreferred" makes design
      logic incoherent. Hard constraints reject; soft constraints rank.
    checks:
      - Each applied rule is classified hard vs soft before it is enforced.

  - id: QA-02
    class: QA
    principle: Reject a candidate design as invalid if it violates any hard constraint, before any ranking on preferences.
    force: MUST
    evidence_tier: A
    contexts: [all]
    exceptions: []
    sources: [S10]
    rationale: >
      A design that lies (truncated bars, missing color bar, unreadable text) cannot
      be redeemed by scoring well on soft preferences.
    checks:
      - No hard-constraint violation survives into the ranked set.

  - id: QA-03
    class: QA
    principle: Resolve competition among valid designs by minimizing total weighted soft-constraint cost.
    force: SHOULD
    evidence_tier: A
    contexts: [all]
    exceptions: []
    sources: [S10]
    rationale: >
      Once validity is assured, an explicit weighted trade-off makes the choice
      reproducible instead of a matter of taste.
    checks:
      - The preferred valid design has the lowest stated aggregate soft cost.

  - id: QA-04
    class: QA
    principle: Ground soft-preference weights in graphical-perception evidence and keep them as updatable data.
    force: SHOULD
    evidence_tier: A
    contexts: [all]
    exceptions: []
    sources: [S10, S15]
    rationale: >
      Weights learned from perception experiments outperform hand-tuned intuition
      and can improve as evidence accrues.
    checks:
      - Weights cite perceptual evidence and are versioned, not hard-coded lore.

  - id: QA-05
    class: QA
    principle: Have someone from the target audience interpret a draft and catch misreadings before shipping.
    force: SHOULD
    evidence_tier: B
    contexts: [all]
    exceptions: []
    sources: [S03]
    rationale: >
      The author knows the intended reading and cannot see their own ambiguity;
      an outside reader surfaces it cheaply.
    checks:
      - A naive reader's interpretation matches the intended takeaway.

  - id: QA-06
    class: QA
    principle: Before publishing, verify text contrast with a tool and confirm every color-coded distinction has a non-color backup.
    force: SHOULD
    evidence_tier: A
    contexts: [all]
    exceptions: []
    sources: [S16, S05]
    rationale: >
      Contrast and color-only failures are invisible to the normally-sighted author
      but decisive for many readers; a mechanical check catches them.
    checks:
      - Contrast measured; grayscale/CVD simulation preserves all distinctions.

  - id: QA-07
    class: QA
    principle: Treat chart size and gridline spacing as perception-affecting variables to inspect, not cosmetic afterthoughts.
    force: SHOULD
    evidence_tier: B
    contexts: [all]
    exceptions: []
    sources: [S15]
    rationale: >
      Heer & Bostock found size and reference spacing change decoding accuracy;
      they belong in the QA pass.
    checks:
      - Final size and gridline spacing are evaluated for readability.

  - id: QA-08
    class: QA
    principle: Inspect the actual rendered artifact at final size in its real medium before declaring it done; repair defects found there.
    force: MUST
    evidence_tier: B
    contexts: [all]
    exceptions: []
    sources: [S06, S03]
    rationale: >
      Overlapping labels, clipped legends, and off colors appear only in the render;
      a spec that is never viewed is never verified. This is renderer-independent —
      it applies to any output the tool produces.
    checks:
      - The final render was viewed at final size and passes the hard gates.

  # ---- ACCESS --------------------------------------------------------------
  - id: ACCESS-01
    class: ACCESS
    applies_in_modes: [colorblind_safe, journal, accessible_web]   # opt-in; see principles/modes.md
    principle: Never use color as the sole means of conveying information; add a redundant text, shape, icon, pattern, or position cue.
    force: MUST
    evidence_tier: A
    contexts: [all]
    exceptions: []
    sources: [S16, S08, S05]
    rationale: >
      Color-blind readers and grayscale reproduction lose color-only distinctions
      entirely; redundant encoding preserves the information.
    checks:
      - Every meaning carried by color is also carried by a non-color channel.

  - id: ACCESS-02
    class: ACCESS
    applies_in_modes: [colorblind_safe, journal, accessible_web]   # opt-in; see principles/modes.md
    principle: Do not pair red and green (or other confusable hues) at similar luminance; use color-vision-deficiency-safe palettes.
    force: MUST
    evidence_tier: A
    contexts: [color_encoding]
    exceptions: []
    sources: [S05, S06, S09]
    rationale: >
      Red-green confusion is the most common CVD; a CVD-safe palette (e.g. an
      established qualitative set) avoids it.
    checks:
      - Palette passes a CVD simulation with distinctions intact.

  - id: ACCESS-03
    class: ACCESS
    principle: Meet minimum luminance-contrast thresholds for text — as a baseline, 4.5:1 for normal text and 3:1 for large text — adapting the specific numbers to the medium.
    force: MUST
    evidence_tier: A
    contexts: [text_on_background]
    exceptions: []
    sources: [S16]
    rationale: >
      WCAG contrast minimums are the tested floor for readability; the thresholds
      are web-UI norms that transfer to figures/slides with judgment (see conflicts.md),
      but the principle of a measured floor holds.
    checks:
      - Measured text contrast meets or exceeds the adopted threshold.

  - id: ACCESS-04
    class: ACCESS
    applies_in_modes: [colorblind_safe, journal, accessible_web]   # opt-in; see principles/modes.md
    principle: When distinguishing elements by color, also make them differ in lightness (at least ~3:1); hue-only differences are insufficient.
    force: SHOULD
    evidence_tier: A
    contexts: [color_encoding]
    exceptions: []
    sources: [S16]
    rationale: >
      Hue discrimination fails under CVD and low-quality displays; a lightness
      difference is robust across viewers and reproduction.
    checks:
      - Color-coded categories differ in lightness, not hue alone.

  - id: ACCESS-05
    class: ACCESS
    applies_in_modes: [print_grayscale]   # opt-in; see principles/modes.md
    principle: Get the figure working in grayscale first, then add color as an enhancement.
    force: SHOULD
    evidence_tier: A
    contexts: [color_encoding]
    exceptions: []
    sources: [S09]
    rationale: >
      A figure that reads in grayscale is guaranteed to survive CVD and monochrome
      printing; color then only adds, never carries alone.
    checks:
      - The grayscale version preserves all essential distinctions.

  # ---- CRIT ----------------------------------------------------------------
  - id: CRIT-01
    class: CRIT
    principle: Justify each encoding and interaction choice against known perceptual and cognitive principles.
    force: SHOULD
    evidence_tier: A
    contexts: [all]
    exceptions: []
    sources: [S01]
    rationale: >
      Munzner's justification-based review catches poor choices before costly
      implementation; an unjustified choice is an untested guess.
    checks:
      - Each nontrivial choice cites a principle or evidence for it.

  - id: CRIT-02
    class: CRIT
    principle: Match the evaluation method to the level of the claim being made about the visualization.
    force: MUST
    evidence_tier: A
    contexts: [evaluation]
    exceptions: []
    sources: [S01]
    rationale: >
      A perceptual claim needs a perceptual test, an adoption claim needs a field
      study; mismatched validation proves nothing.
    checks:
      - The validation evidence addresses the specific claim's level.

  - id: CRIT-03
    class: CRIT
    principle: When a result image is offered as evidence that a design works, point out explicitly what in it works.
    force: SHOULD
    evidence_tier: A
    contexts: [evaluation, review]
    exceptions: []
    sources: [S01]
    rationale: >
      An unexplained "looks good" figure is not evidence; naming the effective
      feature makes the claim inspectable.
    checks:
      - Evidence figures come with an explanation of the working feature.

  - id: CRIT-04
    class: CRIT
    principle: Encode contested guidelines (such as the axis-zero rule outside bars) as soft weighted constraints so their trade-offs stay explicit rather than absolute.
    force: MAY
    evidence_tier: A
    contexts: [all]
    exceptions: []
    sources: [S10]
    rationale: >
      Draco shows contested rules are best modeled as weighted preferences; forcing
      them to hard rules produces brittle, wrong recommendations.
    checks:
      - Contested rules appear as weighted, adjustable preferences.

  - id: CRIT-05
    class: CRIT
    principle: Let aesthetic choices serve understanding rather than replace it; subordinate beauty to the reality of the underlying data.
    force: SHOULD
    evidence_tier: B
    contexts: [outreach, persuasive]
    exceptions: []
    sources: [S12]
    rationale: >
      Attractive but misleading visuals persuade wrongly; aesthetics earn their
      place only when they aid honest comprehension.
    checks:
      - No aesthetic choice degrades accuracy or reading.

  - id: CRIT-06
    class: CRIT
    principle: Do not treat the visual encoding as the only real design problem.
    force: AVOID
    evidence_tier: A
    contexts: [all]
    exceptions: []
    sources: [S01]
    rationale: >
      Fixating on encoding while ignoring the domain/abstraction/algorithm levels
      is the classic way to produce a beautiful chart that answers the wrong question.
    checks:
      - Upstream levels (problem, abstraction) were addressed, not just the chart.

  # ---- MOTION (candidates, 2026-10-28) ---------------------------------------
  # Extracted for the visual-presentation family (presentation/BRIEF.md). These are
  # CANDIDATES: none has passed the blind animated-vs-static test yet. Extra fields
  # beyond the shared schema:
  #   contexts           : medium tags slides | web | video (plus task tags)
  #   platforms          : whether it can be honoured in PowerPoint, Keynote, Google Slides
  #   practitioner_only  : true when no tier-A source carries the claim
  #   refutation         : the blind animated-vs-static result that would show it wrong
  #   validation         : what the tests so far actually showed for this entry (revision 1,
  #                        2026-10-28); owner ratings are n=1 blind judgment, not research
  #   status             : absent = candidate; "retired" with a reason (never delete an id)
  # Tier A here means a peer-reviewed source carries the claim; where that claim is a
  # design guideline the paper states rather than tests, the rationale says so.
  # P01, P02, P07 and P15 are reference_only (abstract or metadata); they are cited
  # as corroboration only, never as the sole carrier of a claim.

  - id: motion.01
    class: MOTION
    principle: Default to a static view or a stepped static sequence; animate only when you can name the job the motion does (keeping marks identifiable across a change of view, drawing attention to one change, or showing a process that is itself change) and the static alternative does that job worse; a sequence of views is not by itself a job.
    force: SHOULD
    evidence_tier: A
    contexts: [slides, web, video]
    platforms: {powerpoint: holds, keynote: holds, google_slides: holds}
    practitioner_only: false
    exceptions: [outreach pieces whose stated goal is affect rather than reading (see motion.22), "view changes where keeping marks identifiable is the job (motion.02), which then counts as named"]
    sources: [P04, P05, P27, P20, P01]
    rationale: >
      Heer and Robertson (P04) call animation "a double-edged sword": attention capture,
      object constancy, implied causality and engagement each help or mislead depending on
      use, and animation is ephemeral, which complicates comparison. Robertson et al. (P05)
      found trend animation least effective for analysis and error-prone even in
      presentation. Fisher (P27) closes on "what function does the animation serve?" and
      "that complexity should pay off". Apple HIG (P20): "Don't add motion for the sake of
      adding motion." Tversky et al. (P01, abstract only) is the canonical skeptical review.
      Revision 1: a deck that is a sequence of views does not license motion between every
      pair; a step with no job is a cut, or a colour/opacity change if it only highlights
      (timing in motion.09). The owner's blind rating (n=1) sharpens this into motion.28.
    checks:
      - The brief names the job the motion does in one sentence.
      - A static alternative was considered and the reason it loses is recorded.
      - Each animated step has its own named job; steps without one are cuts or colour/opacity changes.
    validation: >
      model-judge rounds 1-2 (B12, B13): no separation (ceiling). Owner blind rating (n=1): B01 unguided animation 'just fluff', B01 principled animation neutral, final frame carried the meaning; consistent with this entry, not a test of it.
    refutation: >
      Across the test briefs where no such job can be named, blind judges and comprehension
      checks favour the animated build over the best static build as often as, or more often
      than, the briefs where a job is named. That would mean naming the job does not predict
      when animation wins.

  - id: motion.02
    class: MOTION
    principle: When the view of the same data changes (filter, sort, rescale, regroup, switch chart type (see motion.29), step in time), use an animated transition rather than a hard cut so the viewer can follow which mark became which.
    force: SHOULD
    evidence_tier: A
    contexts: [slides, web, video, view_change]
    platforms: {powerpoint: partial, keynote: partial, google_slides: partial}
    practitioner_only: false
    exceptions: [nearly every mark moves and following identity is not the task (motion.04), the task is comparing the two states (motion.04), "the final frame already links each mark's start to its end (slope lines, arrows, traces), so identity needs no motion (motion.04, motion.28)", the platform cannot keep mark identity (motion.26)]
    sources: [P04, P27, P09, P14]
    rationale: >
      In two controlled experiments (n = 24) animated transitions beat static cuts for both
      object tracking and estimating change, across all transition types tested (P04); the
      authors stress presentations, where viewers who are not driving cannot predict the
      result of a change. Fisher (P27) argues the same for an audience following a presenter.
      Slide apps can do this only for objects they can match across slides (motion.26).
    checks:
      - Each mark that persists across the change is visibly the same object throughout.
    validation: >
      model-judge rounds 1-2 (B01, B03, B14): no separation (ceiling). Owner blind rating (n=1) of B01: motion between rankings judged fluff (N) or neutral (P) because the slope chart already carried identity.
    refutation: >
      For view-change briefs, viewers of the static cut (with the same labels and the same
      dwell time) answer which-item-went-where and how-much-did-it-change questions as
      accurately as viewers of the animated transition.

  - id: motion.03
    class: MOTION
    principle: For trends over many items, or any reading that needs several frames compared, show small multiples or overlaid traces; animated playback is a presentation device for a small, clean story, not a way to show many trajectories.
    force: SHOULD
    evidence_tier: A
    contexts: [slides, web, video, time_series, trend_reading]
    platforms: {powerpoint: holds, keynote: holds, google_slides: holds}
    practitioner_only: false
    exceptions: [few items moving in step, no reversals, a narrator pointing at the target (P05 conclusion; P27 on Rosling)]
    sources: [P05, P27, P32]
    rationale: >
      P05 (two studies, 18 each): small multiples were more accurate than animation
      (p < .001); in analysis animation was the slowest (83 s vs 46 s for small
      multiples); in presentation it was fastest only because viewers could not replay and
      had to guess; participants reported losing track of points (4.8 on a 0-6 scale). The
      authors advise presenters to make the data "tell a clean story": not too many points,
      no reversals, points moving in step. Fisher (P27) attributes Rosling's success (P32)
      to knowing the answer, fixed axes, few highlighted countries, packs moving together
      and live narration with a pointer.
    checks:
      - If more than a handful of items move independently, a small-multiples or trace view exists.
      - Animated playback keeps the same axes throughout and the story names which items to watch.
    validation: >
      model-judge rounds 1-2 (B02, B12): no separation (ceiling). Owner blind rating (n=1): B02 unguided animation of 15 trails liked (5/6) for the timed reveal of the drop; the principled B02 was not rated.
    refutation: >
      For a many-item trend brief, viewers of the animated playback match or beat viewers of
      the small multiples on accuracy for trend and reversal questions.

  - id: motion.04
    class: MOTION
    principle: When the reader must compare the before and after, keep both on screen (side by side, ghosted start, trace, slope lines); when nearly everything on screen would move at once and following individual marks is not the task, cut to the new view instead of animating; when following identity is the task (a rank reshuffle), prefer an end view that links each start to its end, and if you still animate, stagger the movers.
    force: SHOULD
    evidence_tier: A
    contexts: [slides, web, video, comparison]
    platforms: {powerpoint: holds, keynote: holds, google_slides: holds}
    practitioner_only: false
    exceptions: []
    sources: [P04, P05, P27]
    rationale: >
      Animation is ephemeral: once a frame has passed, the viewer must hold it in memory
      (P04). In P05's presentation condition only the final year stayed on screen, so viewers
      either had the answer or gave up. Fisher (P27): if the user is meant to compare before
      with after, animation is less likely to help; if everything moves, "perhaps it would be
      better to simply switch atomically". The cut-when-everything-moves half rests on Fisher
      alone (tier C); the keep-both-states half has P05's accuracy result behind it.
      Revision 1 (rank change, where every mark moves but identity is the point): P04 found
      direct sorting animation suffered from occlusion when three or more items overlapped and
      added staggered onsets (section 4.1.2); its Sort Bars condition favoured animation over a
      cut at the .10 level. Fisher (P27) reports staggered sorting "much clearer" than moving
      all bars at once. A slope chart already carries identity statically, which is what the
      owner's blind rating of B01 found (motion.28).
    checks:
      - Any question the audience is asked about the start state can be answered from the final frame.
      - If over roughly half the marks change position, a cut or side-by-side was chosen, or identity is the task and the end view links start to end (motion then optional, and staggered if used).
    validation: >
      model-judge rounds 1-2 (B01, B05, B10): no separation (ceiling). Owner blind rating (n=1) of B01: the final static frame held all the meaning; rank-change wording revised accordingly.
    refutation: >
      In comparison briefs, viewers who saw only the animation (end state left on screen)
      answer start-versus-end questions as accurately as viewers of the side-by-side static.

  - id: motion.05
    class: MOTION
    principle: Keep every frame of a transition a valid chart; a mark stands for the same datum from start to end, values that do not change do not visibly change, and different operations (a time step versus swapping in another variable) look different.
    force: MUST
    evidence_tier: A
    contexts: [slides, web, video, view_change]
    platforms: {powerpoint: holds, keynote: holds, google_slides: holds}
    practitioner_only: false
    exceptions: ["unavoidable intermediate deformation in a chart-type morph (bar-to-wedge, line-to-stack; motion.29), kept as brief as possible, provided every mark keeps its datum and the invariant holds (a split's parts sum to the total in every frame)"]
    sources: [P04, P27, P14]
    rationale: >
      P04's congruence guidelines: keep intermediate states valid data graphics, do not
      reuse marks for different data points, use consistent mappings for the same operation,
      and give different operations noticeably different transitions, because reusing a
      time-step animation for a variable swap "abuses object constancy". Fisher (P27):
      "Preserve valid mappings" and "Maintain the invariant" (his bar-to-pie example in which
      bars grew both long and fat broke the rule). In P14's study viewers called bars that
      rose before their axis updated "manipulated". These are design guidelines stated in tier-A
      papers, not separately tested; this is a truth-floor rule (G1, G12).
    checks:
      - Sampled mid-transition frames show no mark whose drawn size contradicts its value on the visible scale.
      - No mark is re-used for a different datum.
      - When a total splits into parts (line to stacked area, bar to stacked bar), the parts sum to the total in every sampled frame.
    validation: >
      model-judge rounds 1-2 (B08): no separation (ceiling); mid-transition frame validity is not checked by any automated gate (B11's line-to-stack frames unverified).
    refutation: >
      This is a validity rule, not a preference, so a preference test cannot refute it. It
      would be wrong only if viewers shown transitions that break it (mark reused, invariant
      broken) answer value and identity questions as accurately as viewers of transitions
      that keep it.

  - id: motion.06
    class: MOTION
    principle: Keep the scale fixed across steps where the data allow; when an axis must rescale, stage the rescale apart from the value change and keep the gridlines through it.
    force: SHOULD
    evidence_tier: A
    contexts: [slides, web, video, view_change, time_series]
    platforms: {powerpoint: partial, keynote: partial, google_slides: partial}
    practitioner_only: false
    exceptions: [the range grows by orders of magnitude, where a fixed scale hides the early steps]
    sources: [P04, P27, P14]
    rationale: >
      In P04, axis rescaling raised error and "don't know" responses in every condition;
      animation reduced the harm, and viewers significantly preferred staged animation for
      rescales. The authors recommend common scales across time steps, and propose keeping
      gridlines through a rescale (their animations faded the gridlines, which removed
      landmarks mid-transition; that proposal is untested). Fisher (P27) also keeps the
      coordinate space meaningful. P14 adds a caution: staging the x and y rescales apart from
      each other was liked less than rescaling both together.
    checks:
      - A domain that changes between steps is a recorded choice, not a renderer default.
      - During a rescale, at least one landmark (gridline or tick) stays visible throughout.
    validation: >
      model-judge rounds 1-2 (B04): no separation (ceiling).
    refutation: >
      For a time-step brief needing a rescale, viewers of the unstaged rescale (no landmarks
      kept) estimate change as accurately as viewers of the staged one.

  - id: motion.07
    class: MOTION
    principle: Use one stage, or at most two simple stages (for example axes, then values), for a complex transition; do not break it into many small steps. Stages are counted within one run of motion between two advances, so a click boundary starts a new count (each click is then a step under motion.21).
    force: SHOULD
    evidence_tier: A
    contexts: [slides, web, video, view_change]
    platforms: {powerpoint: holds, keynote: holds, google_slides: partial}
    practitioner_only: false
    exceptions: [a build that the speaker paces step by step (motion.12), where each step is its own point]
    sources: [P04, P14, P27]
    rationale: >
      P04: simple staging reduced tracking error in most conditions and was strongly
      preferred, but the heavily staged transitions (stacked bars, donut) raised error, and
      "most subjects laughed" at one. The authors conclude it is better to cut unnecessary
      motion than to do "one thing at a time". In P14's crowd study (n = 53) single-stage
      designs (2 s) were ranked above two- and three-stage designs (667 ms per stage), and
      the authors re-tuned Gemini to favour them. Fisher (P27) argues "do one thing at a
      time"; see conflicts.md section 10.
    checks:
      - A data transition has no more than two stages unless each stage is a separate click.
    validation: >
      model-judge rounds 1-2 (B01, B08): no separation (ceiling).
    refutation: >
      A three- or four-stage version of the same transition is judged clearer, and answered
      more accurately, than the one- or two-stage version in blind comparison.

  - id: motion.08
    class: MOTION
    principle: Ease tracked marks in and out (slow-in, slow-out); do not move marks the viewer must follow at constant speed or with abrupt starts and stops.
    force: SHOULD
    evidence_tier: A
    contexts: [slides, web, video, view_change]
    platforms: {powerpoint: partial, keynote: holds, google_slides: unverified}
    practitioner_only: false
    exceptions: [opacity and colour changes, where position tracking is not at stake]
    sources: [P06, P04, P21, P19, P23, P35]
    rationale: >
      P06 (n = 12, controlled): slow-in/slow-out beat constant speed, fast-in/fast-out and
      adaptive pacing for tracking one point in a moving cloud. The authors explain it by
      smooth pursuit: easing makes the start and end predictable. P04 derives slow-in/slow-out
      from its predictability guideline. Carbon (P21) and Material (P19) say linear motion
      looks unnatural or mechanical. Keynote (P23) offers Ease In and Ease Out timing;
      reveal.js auto-animate defaults to ease-out (P35). The PowerPoint and Google Slides
      captures (P22, P41) do not name an easing control.
    checks:
      - Position transitions of data marks use an ease-in-out curve, not linear.
    validation: >
      untested as a variable (applied in every arm-P build); model-judge rounds 1-2: no separation (ceiling).
    refutation: >
      In a blind tracking test of the same transition, the linear version is tracked as
      accurately as the eased one.

  - id: motion.09
    class: MOTION
    principle: Time a data transition at about one second (0.7 to 2 s per stage, longer when much moves but capped at about 2 s; split anything longer into advanced steps); a colour or opacity change with no position to track may be shorter (about 0.3 to 0.7 s); keep interface feedback motion short (roughly 100 to 500 ms), and scale with the distance travelled.
    force: SHOULD
    evidence_tier: A
    contexts: [slides, web, video]
    platforms: {powerpoint: holds, keynote: holds, google_slides: partial}
    practitioner_only: false
    exceptions: [ambient or explanatory video segments paced by narration (motion.13)]
    sources: [P04, P06, P14, P05, P19, P21, P35]
    rationale: >
      P04 recommends "as long as needed, but no longer", around one second (following P05),
      and after viewers said half-second stages were too fast, recommends about a second per
      stage. P06 notes that a one-second transition spends about 30% of its length in the
      eye's pursuit response. In P14, 2-second single-stage designs were preferred as "smooth
      and slow". P05's viewers rated 1-second playback neither too fast nor too slow. The
      interface figures come from design systems (P19: 50 to 600 ms, long 450-600 ms; P21: 70
      to 700 ms, longer for larger moves) and govern interface elements, not data marks; see
      conflicts.md section 11. Material says its duration and easing system is no longer
      maintained (replaced by springs). Google Slides offers only a speed slider (P41).
      Revision 1: the 2 s cap is the longest duration any held source tested for data marks
      (P14's preferred single stage); nothing beyond it is evidenced, so the cap is a
      practitioner bound. The colour/opacity band is also practitioner: P04 fades marks in and
      out by alpha blending without stating a time, P06's pursuit argument covers tracked
      position only, and Carbon's 110 ms fade token (P21) is for interface elements.
    checks:
      - Data-mark position transitions run between about 0.7 and 2 s per stage, none over about 2 s.
      - Colour- or opacity-only changes run about 0.3 to 0.7 s; interface feedback under about 0.5 s.
    validation: >
      model-judge rounds 1-2 (B04, B14): no separation (ceiling). Duration gate (0.2-2 s) passed on all 14 P builds; frame quantisation (~0.1-0.2 s) prevented confirming the 0.7 s floor on short colour steps.
    refutation: >
      A blind test of the same transition at about 0.4 s, 1 s and 2.5 s finds no accuracy
      difference, or finds the 0.4 s version best.

  - id: motion.10
    class: MOTION
    principle: Keep the number of things the viewer must follow independently to about four; move groups together so they read as one (common fate), and point at the one to watch; when the data hold more movers than that, make the targets distinct before or as the motion starts (the rest greyed, static or moving as one group), not only at the end.
    force: SHOULD
    evidence_tier: A
    contexts: [slides, web, video]
    platforms: {powerpoint: holds, keynote: holds, google_slides: holds}
    practitioner_only: false
    exceptions: []
    sources: [P08, P27, P04, P05]
    rationale: >
      Fisher (P27) cites perception research (Cavanagh and Alvarez 2005, not in this archive)
      that viewers have trouble tracking more than four or five objects independently, and
      says Rosling succeeds by moving packs together and pointing. P08 (crowd study plus
      n = 10 lab) confirms common fate is a strong grouping cue, with motion the strongest.
      P04: "Group similar transitions." P05's viewers lost track of points ("the dots flew
      everywhere"). The number four is secondary (P27 quoting a source we do not hold); the
      grouping claim is primary (P08). Revision 1: for many trails (B02, fifteen), P27
      attributes Rosling's success to a few highlighted countries among the pack, and P05's
      "clean story" advice is about what the viewer is told to watch; a highlight that arrives
      only after the motion has asked the viewer to track everything comes too late.
    checks:
      - At most about four independently moving targets the viewer is asked to follow; the rest move in shared groups or stay put.
      - With more movers than that, the targets are highlighted before or as the motion starts.
    validation: >
      model-judge rounds 1-2 (B02): no separation (ceiling). Owner blind rating (n=1): B02 unguided liked; principled B02 not rated.
    refutation: >
      Viewers asked to follow eight independently moving, unhighlighted items answer as
      accurately as viewers asked to follow four, with every other property held fixed.

  - id: motion.11
    class: MOTION
    principle: To pick out one group during a transition, use a dynamic channel the encoding is not already using (pulsing size or brightness); do not move marks to group them when position encodes data.
    force: SHOULD
    evidence_tier: A
    contexts: [web, video, slides]
    platforms: {powerpoint: partial, keynote: partial, google_slides: partial}
    practitioner_only: false
    exceptions: []
    sources: [P08]
    rationale: >
      P08: coordinated change in luminance or size produces grouping (common fate) without
      motion; if position already encodes an attribute, moving marks to group them would read
      as a change in that attribute. Their ranking: motion > (dynamic luminance, size,
      luminance); dynamic size > (dynamic luminance, position); dynamic luminance > size. Large
      position changes may hide smaller colour or size changes (participants' comments, not
      measured). Slide apps offer emphasis effects (pulse, grow) but not data-bound ones.
    checks:
      - A highlight-by-motion does not use a channel that already encodes data.
    validation: >
      model-judge rounds 1-2 (B06): no separation (ceiling).
    refutation: >
      Viewers find the highlighted group as quickly and accurately when it is singled out by a
      static colour change as by a dynamic size or brightness change.

  - id: motion.12
    class: MOTION
    principle: Break an animated explanation into short segments the speaker or reader advances (click, step, scroll position) rather than one continuous auto-played run.
    force: SHOULD
    evidence_tier: A
    contexts: [slides, web, video]
    platforms: {powerpoint: holds, keynote: holds, google_slides: holds}
    practitioner_only: false
    exceptions: [ambient loops with no reading task; kiosk loops (then motion.20 applies)]
    sources: [P03, P09, P13, P23, P41]
    rationale: >
      P03: learner-paced segments beat a continuous narrated animation on transfer (d = 1.36,
      a single experiment, and the segmented group also had more study time). P13 (n = 240)
      found no reliable engagement difference between stepper and scroller pacing, so the
      claim is about segmenting, not about the input device. Keynote builds (P23) and Google
      Slides animations (P41) default to "on click". This is learning research, not chart
      research.
    checks:
      - No single auto-advancing run of motion exceeds one point of the argument.
    validation: >
      model-judge rounds 1-2 (B07, B09): no separation (ceiling); model judges stepped at their own pace, so segmenting could not matter.
    refutation: >
      A continuous auto-played version and a segmented, presenter-paced version of the same
      material produce equal comprehension when watched blind at matched total time.

  - id: motion.13
    class: MOTION
    principle: Narrate at the same moment as the motion it describes; when there is narration over an animation, do not also put the same words on screen; and put labels on or beside the moving thing, not in a distant legend.
    force: SHOULD
    evidence_tier: A
    contexts: [slides, video, web]
    platforms: {powerpoint: holds, keynote: holds, google_slides: holds}
    practitioner_only: false
    exceptions: [audiences reading without sound (web, captions), where on-screen text is the narration; no animation present (P03 finds verbal redundancy then helps)]
    sources: [P03, P16, P28]
    rationale: >
      P03's Table 3: temporal contiguity, narration at the same time as the animation (d = 1.30,
      8 experiments); redundancy, narration alone beating narration plus identical on-screen text
      over animation (d = 0.69, 3 experiments); spatial contiguity, words placed near the graphic
      (d = 0.48, 1 experiment). P03 also reports that without animation, narration plus
      on-screen text beats narration alone. P16 (n = 110) and P28 apply these principles to static
      slides. All of this is learning research.
    checks:
      - Narration and its motion are synchronised (a speaker-cue map or timed captions exists).
      - Labels on moving marks travel with them.
      - In a silent piece, timed captions stand in for narration: each appears as its motion starts and is one short sentence (conflicts.md section 13, flip).
    validation: >
      untested: captures were silent, so narration sync could not be applied or judged. Owner blind rating (n=1): B02 reveal valued for landing with the narration's point (supports the timing idea).
    refutation: >
      Blind comprehension does not differ between a version with narration synchronised to the
      motion and one where narration comes before or after the motion.

  - id: motion.14
    class: MOTION
    principle: Cut decorative motion that carries no data or argument (entrance flourishes, bounces, spins, animated titles, parallax backgrounds).
    force: AVOID
    evidence_tier: A
    contexts: [slides, web, video]
    platforms: {powerpoint: holds, keynote: holds, google_slides: holds}
    practitioner_only: false
    exceptions: [one deliberate expressive moment at a section break or the payoff (P21 "occasional, important moments")]
    sources: [P03, P04, P20, P21, P17, P02]
    rationale: >
      P03's coherence effect (d = 0.90, 5 experiments) comes from removing interesting but
      extraneous material. Note that what was removed was background music and video clips,
      not motion, so carrying it over to decorative motion is an inference. P04 calls frivolous
      animation "temporal chart junk". Apple HIG (P20): gratuitous motion distracts and can cause
      discomfort. Carbon (P21): avoid purely decorative easing. WCAG 2.3.3 (P17) names parallax
      as typically non-essential. Hoffler and Leutner (P02, abstract only) found larger gains
      for representational than for decorational animation.
    checks:
      - Every motion in the piece maps to a data change, a reading cue, or a declared expressive moment.
    validation: >
      model-judge rounds 1-2 (B12, B13): no separation (ceiling). Owner gallery (n=1, Visitors 2026-10-31, ambient piece): data-free 'play' between idle creatures kept, but only as a brief motion with nothing that looks like data moving; motes and bridges read as exchange. Candidate ambient exception, provisional.
    refutation: >
      Versions with decorative entrance motion are judged clearer and score at least as well on
      recall as the same deck without it, in blind comparison.

  - id: motion.15
    class: MOTION
    principle: Use motion to cue attention sparingly and one target at a time; motion grabs the eye, including in peripheral vision, so a second moving thing competes with the point.
    force: SHOULD
    evidence_tier: A
    contexts: [slides, web, video]
    platforms: {powerpoint: holds, keynote: holds, google_slides: holds}
    practitioner_only: false
    exceptions: []
    sources: [P04, P03, P08, P20, P21, P12]
    rationale: >
      P04: motion is "highly effective at attracting attention" and easily seen peripherally,
      which is "a powerful force for distraction". P03: signalling aids transfer (d = 0.74, one
      experiment). P08: participants said moving marks drew their attention away from size or
      brightness changes. P20: avoid motion at the edge of view. P21: reserve expressive motion
      for important moments. P12 (50 data videos) found animation, appear/disappear and
      highlighting the most common attention cues, which is a description of practice, not
      evidence of effect.
    checks:
      - At any moment at most one element moves to cue attention; ambient loops are off while the speaker makes a point.
    validation: >
      model-judge rounds 1-2 (B06): no separation (ceiling).
    refutation: >
      Viewers find the cued element as fast and remember the point as well when two or more
      elements move at once as when only the cued one moves.

  - id: motion.16
    class: MOTION
    principle: Make every frame held for reading, and above all the final frame, a complete static chart; the piece must still make its point with motion off (printed, PDF, a reduced-motion setting, a frozen projector).
    force: MUST
    evidence_tier: B
    contexts: [slides, web, video]
    platforms: {powerpoint: holds, keynote: holds, google_slides: holds}
    practitioner_only: true
    exceptions: [a process whose content is the motion itself (motion.24); even then, supply a key-frame static, "a transient build state such as axes-before-data (motion.23), which must still carry title, axes and units; the motion-off export is the final frame"]
    sources: [P27, P20, P17, P18, P34, P05]
    rationale: >
      Fisher (P27): "Individual frames should be meaningful, so that users can capture and share
      those images." Apple HIG (P20): avoid using motion "as the only way to communicate important
      information". WCAG and MDN (P17, P18) presume motion can be removed. A community deck skill
      (P34) notes that PDF export of HTML slides drops the animation. P05's presentation condition
      shows the cost when only the final frame remains. This is the motion-off check in the
      brief's ruling Q5.
    checks:
      - The motion-off render (reduced-motion or last-frame export) contains every label, unit and claim.
    validation: >
      compliance only: final_frame_matches_reduced gate passed on all 14 P builds; model-judge rounds 1-2 (B05, B11): no separation (ceiling).
    refutation: >
      Briefs whose final frames fail this check do just as well as those that pass in the blind
      animated judgment and in the motion-off review. If so, the rule is not tied to
      communication and is only a portability rule.

  - id: motion.17
    class: MOTION
    principle: On the web, honour the reduced-motion setting by replacing movement (scaling, panning, parallax, scroll-linked motion) with a cut or fade, and let interaction-triggered motion be switched off unless the motion is the information.
    force: MUST
    evidence_tier: A
    contexts: [web]
    platforms: {powerpoint: n/a, keynote: n/a, google_slides: n/a}
    practitioner_only: false
    exceptions: [motion essential to the information (WCAG "essential"), which still needs a static key frame per motion.16]
    sources: [P17, P18, P20]
    rationale: >
      WCAG 2.2 SC 2.3.3 (AAA, P17): motion animation triggered by interaction can be disabled
      unless essential; vestibular reactions include nausea, migraine and needing bed rest; parallax
      and scroll-linked non-essential motion are named. MDN (P18): the media feature detects the
      user's request to minimise non-essential motion; scaling or panning large objects are
      triggers; the example replaces motion with a dissolve. Apple HIG (P20): make motion optional.
      Tier A here means normative standard, not experiment. The slide-app help pages (P22, P23,
      P41) do not mention reduced motion; see conflicts.md section 15.
    checks:
      - With prefers-reduced-motion set, no element translates or scales; state changes still happen by cut or fade.
    validation: >
      compliance only: reduced-motion render gate passed on all 14 P builds; normative, not testable by comprehension.
    refutation: >
      This is a normative accessibility rule, so a comprehension test cannot refute it. The test
      checks only that the reduced-motion render still makes the point (motion.16); if the
      reduced-motion render loses the point, the fault is in the design, not in this rule.

  - id: motion.18
    class: MOTION
    principle: Never flash more than three times per second; give any motion that starts by itself, lasts over five seconds and runs beside other content a pause, stop or hide control.
    force: MUST
    evidence_tier: A
    contexts: [web, video, slides]
    platforms: {powerpoint: partial, keynote: partial, google_slides: partial}
    practitioner_only: false
    exceptions: [motion essential to the activity (WCAG 2.2.2)]
    sources: [P17]
    rationale: >
      WCAG 2.2 SC 2.3.1 (Level A, three flashes) and SC 2.2.2 (Level A, pause/stop/hide), per the
      P17 Understanding pages: five seconds is "long enough to get a user's attention, but not so
      long that a user cannot wait out the distraction". The three-flash rule is already in the
      shared truth floor (modes.md section 4). In a slide app the presenter's advance is the
      control, but a looping auto-play slide needs one.
    checks:
      - No luminance flash train above 3 Hz in the captured video.
      - Auto-started motion over 5 s beside other content has a visible pause control (web) or is presenter-advanced (slides).
    validation: >
      compliance only: no_flashing gate passed on all 14 P builds; normative.
    refutation: >
      Normative; not refutable by a comprehension test. The test only checks that it was met.

  - id: motion.19
    class: MOTION
    principle: Let the viewer replay, scrub or step back through animated data wherever the medium allows (controls on the web, a back-step or a static key-frame slide in a deck, chapters in video), and never make them wait for motion to finish before they can act.
    force: SHOULD
    evidence_tier: A
    contexts: [web, video, slides]
    platforms: {powerpoint: holds, keynote: holds, google_slides: holds}
    practitioner_only: false
    exceptions: []
    sources: [P05, P13, P17, P20]
    rationale: >
      P05: analysts replayed the animation repeatedly; presentation viewers, unable to replay,
      either guessed or gave up. P13: scroller readers scrolled back and forth to replay
      transitions. WCAG 2.2.2 (P17) requires pause for auto-started motion. Apple HIG (P20): "Let
      people cancel motion."
    checks:
      - Web pieces have play/pause and a scrubber or step control; decks have a static key-frame slide or an easy step back.
    validation: >
      model-judge rounds 1-2 (B02, B09): no separation (ceiling); model judges could revisit every frame, so replay had no cost to remove.
    refutation: >
      Viewers who cannot replay are as accurate as viewers who can, on the same animated piece
      and questions.

  - id: motion.20
    class: MOTION
    principle: Do not take viewers' enjoyment or engagement as evidence that an animation communicates; judge it on what viewers can correctly read, recall or decide.
    force: ESCALATE
    evidence_tier: A
    contexts: [slides, web, video, evaluation]
    platforms: {powerpoint: holds, keynote: holds, google_slides: holds}
    practitioner_only: false
    exceptions: ["the stated goal is engagement (outreach), in which case say so in the brief", "builds: this governs whoever evaluates a piece, so a builder has nothing to apply"]
    sources: [P05, P13, P04]
    rationale: >
      P05: animation was rated most enjoyable and exciting yet small multiples were more
      accurate; participants found it "fun" and "emotionally touching" yet confusing. P13
      (n = 240): animated transitions raised engagement scores, with no major comprehension
      differences between conditions. P04: preference tracked accuracy in most conditions but not
      all. This bears on the brief's own test design, where a judge's liking must not be scored
      as communication.
    checks:
      - The evaluation scores comprehension or decision accuracy separately from preference.
    validation: >
      observed three times (model judges): static liked less (4.9 vs 5.5) and judged 'motion helped' far less at equal or better accuracy in rounds 1 and 2; consistent with the claim, but these are model judges, not viewers.
    refutation: >
      Across the test briefs, blind preference for the animated version predicts its
      comprehension advantage closely; that is, preference and accuracy agree in nearly every
      brief.

  - id: motion.21
    class: MOTION
    principle: Between consecutive views or builds, change one thing at a time (time step first, then dimension or measure, and granularity last), and repeat the same order of changes throughout the sequence.
    force: SHOULD
    evidence_tier: A
    contexts: [slides, web, video, sequence]
    platforms: {powerpoint: holds, keynote: holds, google_slides: holds}
    practitioner_only: false
    exceptions: []
    sources: [P11, P09]
    rationale: >
      P11 (143 crowd workers, 696 trials): viewers strongly preferred low-cost transitions (fewer
      changed attributes) and ranked transition types Temporal > (Dimension | Measure) >
      Granularity. In a second study (n = 73) a sequence with consistent parallel structure was
      remembered significantly better than its reversed form; comprehension differences were not
      significant. Professional slideshows mostly changed one dimension at a time and used
      partial animation when more changed. This applies to static step sequences as much as to
      animation.
    checks:
      - Consecutive states differ in one attribute where the story allows; the order of changes repeats.
    validation: >
      model-judge rounds 1-2 (B03, B11): no separation (ceiling).
    refutation: >
      Sequences that change two or more attributes per step are judged as easy to follow, and
      recalled as well, as one-change-per-step sequences of the same content.

  - id: motion.22
    class: MOTION
    principle: Treat where a build or animation pauses or ends as emphasis; stop on the claim, not on a decorative or intermediate frame, and do not let motion imply a cause or relation the data do not support.
    force: SHOULD
    evidence_tier: A
    contexts: [slides, web, video, narrative]
    platforms: {powerpoint: holds, keynote: holds, google_slides: holds}
    practitioner_only: false
    exceptions: []
    sources: [P10, P04, P12, P09]
    rationale: >
      P10 (qualitative rhetoric analysis): animation "leverages time to suggest a story", and
      partial animation that pauses or ends on particular views prioritises them through a
      "climactic" effect. P04: animated behaviour can create perceptions of causality and false
      relations (object constancy abused). P12 (50 data videos) found most build to a single Peak
      near the middle followed by Release. P09 describes pauses between animations used to state
      facts. The emphasis claim comes from qualitative design-space analyses; no effect was
      measured.
    checks:
      - The final frame states the claim; motion between unrelated objects is absent.
    validation: >
      model-judge rounds 1-2 (B07, B10): no separation (ceiling). Owner blind rating (n=1): B02 valued for stopping on the drop as the narration lands it; supports this entry, not a test of it.
    refutation: >
      Viewers name the intended takeaway equally often whichever frame the animation ends or
      pauses on.

  - id: motion.23
    class: MOTION
    principle: Build a chart in the order of the argument, context first (axes, units, baseline), then data in meaningful groups, one click per point the speaker makes; do not build many small pieces one by one, and do not build at all when the steps carry no point of their own (motion.28).
    force: SHOULD
    evidence_tier: C
    contexts: [slides, web]
    platforms: {powerpoint: holds, keynote: holds, google_slides: partial}
    practitioner_only: true
    exceptions: []
    sources: [P09, P23, P41, P03, P11]
    rationale: >
      P09 describes a worked example: the axis appears first with a comment, then each region is
      added, with pauses for facts. Keynote (P23) builds a chart piece by piece, with each wedge a
      click by default ("five wedges, five clicks"). Google Slides (P41) builds lists by paragraph
      and gives no chart-piece build, so a chart there must be split into separate objects. The
      segmenting (P03) and one-change-per-step (P11) results support the logic, but no source tests
      build order on charts directly. Revision 1: the owner's blind rating (n=1) called a build of
      a chart whose final frame held all the meaning concealment; open conflict, conflicts.md
      section 16.
    checks:
      - The first build state shows the title, axes and units; no build step adds a single minor piece.
      - Every build step after the first carries a point the speaker or caption states at that step; otherwise the chart is shown whole.
    validation: >
      model-judge rounds 1-2 (B03, B07): no separation (ceiling). Owner blind rating (n=1): a build of B01 whose final frame held all the meaning read as concealment; open conflict (conflicts.md section 16).
    refutation: >
      A chart shown whole while the speaker talks through it is understood and recalled as well,
      blind, as the same chart built context-first in argument order.

  - id: motion.24
    class: MOTION
    principle: Prefer animation when the content is itself change in time or space (a physical process, a procedure, a spatial or volumetric phenomenon), and make it realistic and representational, not decorative.
    force: MAY
    evidence_tier: A
    contexts: [video, web, slides, process, spatial]
    platforms: {powerpoint: partial, keynote: partial, google_slides: partial}
    practitioner_only: false
    exceptions: [the reader must compare stages (motion.04); add key-frame stills]
    sources: [P02, P24, S12, P03]
    rationale: >
      Hoffler and Leutner (P02, abstract only, 26 studies): overall d = 0.37 for instructional
      animation over static pictures; representational d = 0.40; video-based or highly realistic
      d = 0.76; procedural-motor knowledge d = 1.06. NASA SVS (P24, S12) routinely animates
      spatial Earth-science phenomena, which is already the ENC-10 exception. P03's experiments
      used narrated animations of processes (lightning, pumps). The meta-analysis is held only as
      an abstract; the moderators need the full text before this moves above MAY.
    checks:
      - The thing that moves is the phenomenon, at a stated time scale (data time versus playback time, truth floor).
    validation: >
      model-judge rounds 1-2 (B05, B09, B14): no separation (ceiling).
    refutation: >
      For process briefs, the best static key-frame sequence with arrows matches the animation on
      blind comprehension.

  - id: motion.25
    class: MOTION
    principle: In scroll-driven pieces, tie each step to the reader's scroll position, keep the text and its graphic state aligned, never take over the scroll, and offer a non-scroll fallback.
    force: SHOULD
    evidence_tier: B
    contexts: [web]
    platforms: {powerpoint: n/a, keynote: n/a, google_slides: n/a}
    practitioner_only: true
    exceptions: ["scrolling by script in answer to an explicit reader action (a Next button or key) is stepping, not taking over the scroll; scrolljacking means intercepting or re-timing the reader's own scroll gestures"]
    sources: [P13, P17, P26, P37, P25]
    rationale: >
      P13: three of ten interviewees were frustrated aligning text with transitions in a
      continuous scroller, and the authors report it is "often detrimental" to make navigation feel
      laggy or overridden (scrolljacking); this is community practice, not their measurement. P13
      found no engagement difference between stepper and scroller. WCAG 2.3.3 (P17): scrolling
      movement the user controls is allowed; added non-essential scroll animation must be
      switchable. Pudding and Flourish practice (P26, P25) and Scrollama's step model (P37) are
      practitioner sources.
    checks:
      - Scrolling back restores the earlier graphic state; scroll speed is never altered by script.
    validation: >
      model-judge rounds 1-2 (B11): no separation (ceiling); captures stepped programmatically, so scroll behaviour itself was not exercised.
    refutation: >
      A scroll-jacked version is followed and understood as well, blind, as the scroll-linked one.

  - id: motion.26
    class: MOTION
    principle: Before planning a transition that keeps marks identifiable, check whether the slide app can match those objects across slides; where it cannot (charts in PowerPoint Morph, no matched-object transition found in Google Slides), use a stepped static sequence or chart elements drawn as shapes.
    force: ESCALATE
    evidence_tier: B
    contexts: [slides]
    platforms: {powerpoint: partial, keynote: partial, google_slides: unsupported}
    practitioner_only: true
    exceptions: [self-contained HTML and video builds, where the builder controls mark identity directly]
    sources: [P22, P23, P41, P35]
    rationale: >
      Microsoft (P22): Morph animates objects common to two slides, but "charts don't morph, they
      cross-fade". Keynote (P23): Magic Move animates objects present on both slides, and objects
      only on the first fade out. Google Slides help (P41) lists object animations and slide
      transitions and nothing that matches objects across slides; that is absence in one help
      page, not a verified incapacity. reveal.js (P35) matches by data-id. A cross-fade between
      two charts is a hard cut with a blur and gives none of the object constancy motion.02 counts on.
    checks:
      - For each planned matched-object transition, the target app's matching rule is named and the chart is built so it applies.
    validation: >
      untested: no slide-app build in rounds 1-2 (HTML only); manual app check (brief Q10) still open.
    refutation: >
      Not a communication claim; the manual app check (brief Q10) confirms or refutes the platform
      facts. Refuted if Google Slides is found to match objects across slides, or PowerPoint
      Morph to interpolate native charts.

  - id: motion.27
    class: MOTION
    principle: For interface elements around the data (panels, menus, notices, not data marks), let entering elements decelerate and exiting ones accelerate, make exits shorter than entrances, and keep the motion productive (quick and quiet) except at rare important moments.
    force: MAY
    evidence_tier: B
    contexts: [web]
    platforms: {powerpoint: n/a, keynote: n/a, google_slides: n/a}
    practitioner_only: true
    exceptions: ["data marks, which follow motion.05, motion.08 and motion.09", "pieces whose interface chrome does not move (static buttons), where it has nothing to govern"]
    sources: [P19, P21, P20]
    rationale: >
      Material (P19): enter with decelerate, exit permanently with accelerate, and exits are
      shorter "because they require less attention". It also says this easing system is no longer
      maintained and has been replaced by springs, whose spatial tokens overshoot and bounce
      (conflict section 14). Carbon (P21) uses the same entrance and exit split and separates
      productive from expressive motion. Apple (P20): brief, precise feedback, and avoid motion
      on frequent interactions. These are interface design systems, not data-communication evidence.
    checks:
      - Interface chrome motion is under about 0.5 s and does not overshoot.
    validation: >
      untested: no moving interface chrome in any build.
    refutation: >
      Out of scope for the animated-vs-static test (it concerns interface chrome). It is refuted
      only if the interface-motion convention, when applied to data marks, beats motion.08 and
      motion.09 there.

  - id: motion.28
    class: MOTION
    principle: Use a progressive reveal or animated change only when the change itself is the message and its moment lands with the narration (or caption); do not progressively reveal a chart whose final frame already carries all the meaning, since withholding parts of it without a point per step conceals rather than communicates.
    force: SHOULD
    evidence_tier: C
    contexts: [slides, web, video, narrative]
    platforms: {powerpoint: holds, keynote: holds, google_slides: holds}
    practitioner_only: true
    exceptions: [a build where each step carries its own stated point (motion.23), a process whose content is the motion (motion.24), outreach whose stated goal is affect (motion.01)]
    sources: [P27, P04, P03, P10]
    rationale: >
      Fisher (P27): "what function does the animation serve?" and animation's complexity
      "should pay off"; if the reader can get it from the final image, motion adds burden. P04
      calls frivolous animation "temporal chart junk". P03's temporal contiguity (narration at
      the same time as the motion, d = 1.30) and P10's climactic pause account for why a reveal
      timed to the narrated point can earn its place. The rule itself is the owner's judgment
      from a blind viewing (n=1, 2026-10-28, RESULTS_ROUND2.md): motion earned its place only
      when the change was the message and was revealed as the narration landed it (B02's
      drop); a reveal of a chart whose final frame held all the meaning was "just fluff".
      That is owner judgment, not research; tier C reflects P27, the only source stating it.
    checks:
      - The brief names, for each reveal step, the message that the change itself carries and the narration or caption it lands with.
      - If the final frame alone carries the whole message and no step has its own point, the chart is shown whole.
    validation: >
      owner blind rating only (n=1, 2026-10-28): B01-N 'just fluff', B01-P 'motion had no meaning other than to conceal part of the graph', B02-N valued. Model-judge rounds 1-2 cannot test it (ceiling).
    refutation: >
      Blind viewers (humans, real time) shown a progressive reveal of a chart whose final frame
      carries everything comprehend and recall it better than viewers shown the whole chart
      while the same narration plays.

  - id: motion.29
    class: MOTION
    principle: Morph between chart types only when marks map one to one (bars to wedges, bars to bars, a total line to the stack of its parts); route marks so they do not occlude each other, keep each mark's value and the shared invariant intact, keep the deformed frames brief, and otherwise cut with matched labels.
    force: SHOULD
    evidence_tier: A
    contexts: [slides, web, video, view_change]
    platforms: {powerpoint: unsupported, keynote: partial, google_slides: unsupported}
    practitioner_only: false
    exceptions: [slide apps that cannot match chart objects (motion.26), where a stepped static sequence replaces the morph]
    sources: [P04, P27, P22]
    rationale: >
      P04 section 4.1.5 morphs bars into wedges by interpolating in polar coordinates, reverses
      the radial order to avoid "massive occlusion", and interpolates stacked-to-grouped bars
      in stages to avoid overlap; its Bar to Donut transition was tested and animation beat the
      static cut for tracking (staged versus direct at the .10 level). Fisher (P27) warns that
      a bar-to-pie morph broke the invariant when bars grew both long and fat. Microsoft
      (P22): charts do not Morph, they cross-fade. The guidance on routing and invariants is a
      design guideline stated in a tier-A paper; only the bar-to-donut case was tested.
    checks:
      - Every mark in the source chart maps to one mark in the target, named in the plan.
      - Sampled mid-morph frames keep the invariant (a split's parts sum to the total) and show no overlapping paths that hide a mark.
    validation: >
      untested as such; B08 and B11 morphs built in arm P; model-judge rounds 1-2: no separation (ceiling); no automated mid-frame validity check exists.
    refutation: >
      For a chart-type change, viewers of a hard cut with matched labels track marks and
      estimate values as accurately as viewers of the morph.
