  hazards:
    - "elevation rainbow on a continuous quantity makes false bands at hue boundaries"
    - "LOD gaps can resemble real coverage gaps"
    - "Web Mercator input inflates footprints (1.32x at 40.76 N)"
  license: BSD-2-Clause

