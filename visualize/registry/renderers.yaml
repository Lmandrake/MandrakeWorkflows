# Capability registry: what each renderer can draw, from what data, and how it can mislead.
#
# This is DATA, not a skill. Skills never name a renderer (decision D6); they ask for a
# capability by property (data shape, primitive, output mode, dims) and
# tools/route_renderer.py resolves the properties to renderer ids. tools/check_skills.py
# reads every `id` and `names` entry below and fails any SKILL.md that contains one.
#
# Source: the maintainer's renderer capability notes. Claims are
# hand-written from that review (`verified: hand`) until a probe backs them (`verified: probe`).
#
# Vocabulary (enforced by tests/test_registry.py):
#   status:       runs | pending | dead
#   fit:          P primary · S secondary (works with adaptation or limits) · E evokes only
#                 (looks like the data shape but cannot support reading it)
#   data_shapes:  network, embedding, vector_field, scalar_field, point_samples_3d, geo_flow,
#                 trajectories (spatial paths with timestamps), scalar_time_series, hierarchy,
#                 text_corpus, none (no data; procedural or simulated content)
#   primitives:   points, links, arcs, trails, particles, fluid, mesh, splats, text, contours,
#                 heat, hex, discs, segments, sphere, hud, procedural, lines, bands (state spans)
#   output_modes: interactive_web, interactive_native, still, hires_still, vector_still, video,
#                 deterministic_video   (value = how; null = not available)
#   hidden_defaults: renderer behaviour that changes a mark's look as a function of anything
#                 other than a declared field. Each must be bound or switched off and declared.
#   hazards:      ways the picture can mislead even when every default is handled.
#   tasks:        optional; reader tasks a renderer is unusually good at, for route_renderer --task:
#                 live_monitoring, exploratory_drilldown, many_series_comparison,
#                 event_annotation, distribution_over_time, long_time_series
schema: mv.renderers/v0
renderers:

- id: grafana
  names: [Grafana]
  status: runs
  verified: probe
  install: Homebrew grafana
  adapter: Grafana dashboard-provisioning script
  platform: web (canvas 2D)
  dims: [2d]
  primitives: [lines, points, heat, bands, text]
  data_shapes: {scalar_time_series: P, network: E}
  tasks: [live_monitoring, exploratory_drilldown, many_series_comparison, event_annotation, distribution_over_time, long_time_series]
  output_modes: {interactive_web: "dashboard at 127.0.0.1:3000, provisioned from JSON as code", still: "kiosk page plus headless capture (headless capture script)", hires_still: "capture with device scale 2", video: page recording of a scripted time range, deterministic_video: null}
  hidden_defaults:
    - "auto step: query resolution follows panel width and time range, so peaks are averaged or sampled away and the picture changes when the panel is resized; pin the interval and use max_over_time for peaks"
    - "each step takes the last sample in its window: sub-step reports (specials) vanish unless a rollup keeps them"
    - "the store fills gaps with the last value, so a missing hour reads as a flat line"
    - "smooth interpolation overshoots (below zero, above the peak)"
    - "series colours come from a palette by series order, so adding a series recolours the others"
    - "timezone defaults to the browser's; set utc on the dashboard"
    - "state timeline in threshold colour mode merges every state into one band and ignores value mappings"
    - "heatmap from cumulative le buckets shows +Inf as a row unless excluded"
    - "kiosk footer 'Powered by Grafana'; panels below the fold are lazy and capture empty unless the viewport holds the whole dashboard"
  hazards:
    - "dashboard clutter: many panels with their own axes and no single takeaway; the default is a monitoring wall, not a figure"
    - "each panel has an independent y scale, inviting false comparisons across panels; share the scale by hand"
    - "circular quantities (wind direction) drawn as lines jump at 360/0"
    - "annotation regions carry no text in a still; phases need a labelled state band"
    - "limited art control: one UI font, fixed axis styling, tick density chosen by the tool, no per-panel background"
    - "AGPL-3.0: local use is unaffected; modifying it and serving it to others carries source obligations. The official image-renderer service has no macOS build"
  license: AGPL-3.0

- id: victoriametrics
  names: [VictoriaMetrics, victoria-metrics, vmui]
  status: runs
  verified: probe
  install: Homebrew package
  adapter: dataset loader script
  platform: time-series database with a built-in web explorer
  dims: [2d]
  primitives: [lines]
  data_shapes: {scalar_time_series: S}
  tasks: [exploratory_drilldown, many_series_comparison, long_time_series, live_monitoring]
  output_modes: {interactive_web: "vmui at 127.0.0.1:8428/vmui (ad hoc queries, cardinality explorer)", still: page screenshot, video: null, deterministic_video: null}
  hidden_defaults:
    - "retention defaults to 1 month and drops any older sample on import; historical data needs -retentionPeriod (the stack sets 100y)"
    - "-search.latencyOffset hides the newest 30 s of a live stream; the stack sets it to 0"
    - "re-importing the same samples duplicates them unless the series are deleted first or dedup is on"
    - "vmui's auto step resamples exactly as a dashboard does"
  hazards:
    - "a store and explorer, not a presentation: no annotations, styling or keys"
    - "its own Grafana datasource plugin is AGPL-3.0, unlike the Apache-2.0 store; not needed, the built-in Prometheus datasource reads it"
  license: Apache-2.0

- id: cosmos-gl
  names: [cosmos.gl, cosmos-gl, cosmosgl, Cosmograph]
  status: runs
  verified: hand
  install: <checkout>/cosmosgl-graph
  adapter: cosmos-gl adapter script
  platform: webgl2
  dims: [2d]
  primitives: [points, links]
  data_shapes: {network: P, embedding: S, geo_flow: S, text_corpus: S, hierarchy: S, scalar_time_series: E}
  output_modes: {interactive_web: native, still: page screenshot or preserveDrawingBuffer, hires_still: supersampled screenshot, video: page recording, deterministic_video: seeded positions plus frame-step}
  hidden_defaults:
    - "link length fade: links longer than 150 px drop to 25% opacity, zoom-dependent (on in the pinned defaults, so a config diff cannot see it)"
    - "dot size grows with zoom even in the 'constant' size mode (up to 5x)"
    - "800 ms position transitions"
    - "curved links invent curvature"
    - "simulation and random seed make the layout non-deterministic"
    - "setConfig() resets every value to defaults; change one value with setConfigPartial()"
  hazards:
    - "force layout position is arbitrary up to rotation and reflection; inter-cluster distance means nothing"
    - "simulationCluster can manufacture separation the edges do not support"
    - "edge colour interpolated between endpoints suggests a gradient no data has"
    - "overdraw at millions of points hides interior density"
  license: MIT

